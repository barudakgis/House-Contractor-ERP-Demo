<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3A5F">
<meta name="description" content="Versi demo Housing Contractor ERP — RAB, pengadaan, gudang, lapangan, keuangan, QC per kavling.">
<title>HC-ERP Demo</title>
<style>
:root{
  --ink:#1D3A5F; --ink-2:#2B4F7A; --ink-soft:#DCE5F0;
  --bg:#E4E7EA; --surface:#FFFFFF; --surface-2:#F3F5F7; --line:#CDD3D9;
  --text:#18222D; --muted:#5B6773;
  --hivis:#F2A900; --hivis-ink:#3A2A00; --hivis-soft:#FFF3CF;
  --ok:#2F7D5B; --ok-soft:#DDF0E6; --bad:#B4432A; --bad-soft:#F8E1DA; --warn:#A86A00; --warn-soft:#FBEED2; --info:#2B4F7A; --info-soft:#DCE5F0;
  --radius:10px; --radius-sm:6px;
  --font-head:"Bahnschrift","DIN Alternate","DIN Next","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --shadow:0 1px 2px rgba(20,35,55,.08),0 4px 14px rgba(20,35,55,.06);
  --nav-w:248px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#0F2440; --ink-2:#2C5585; --ink-soft:#1D3553;
  --bg:#0D1826; --surface:#152337; --surface-2:#1B2C43; --line:#2B3E57;
  --text:#E6ECF2; --muted:#9AA8B8;
  --hivis:#F5B82E; --hivis-ink:#2B1F00; --hivis-soft:#3A2F12;
  --ok:#5CC08F; --ok-soft:#173A2B; --bad:#E57A5E; --bad-soft:#40211A; --warn:#E6B04A; --warn-soft:#3A2D12; --info:#8FB4E0; --info-soft:#1D3553;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#0F2440; --ink-2:#2C5585; --ink-soft:#1D3553;
  --bg:#0D1826; --surface:#152337; --surface-2:#1B2C43; --line:#2B3E57;
  --text:#E6ECF2; --muted:#9AA8B8;
  --hivis:#F5B82E; --hivis-ink:#2B1F00; --hivis-soft:#3A2F12;
  --ok:#5CC08F; --ok-soft:#173A2B; --bad:#E57A5E; --bad-soft:#40211A; --warn:#E6B04A; --warn-soft:#3A2D12; --info:#8FB4E0; --info-soft:#1D3553;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:.01em;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.num,td.n,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.hide{display:none!important}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:.75rem}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.side{background:var(--ink);color:#E9EFF6;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--hivis);color:var(--hivis-ink);display:grid;place-items:center;font:700 15px var(--font-head)}
.brand b{font-family:var(--font-head);font-size:1.02rem;display:block}
.brand span{font-size:.75rem;opacity:.7}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#D5DFEA;text-decoration:none;font-size:.93rem}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(242,169,0,.16);color:#fff;box-shadow:inset 3px 0 0 var(--hivis)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:12px 16px;font-size:.78rem;opacity:.8;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px}
.topbar select{max-width:340px}
.content{padding:20px;max-width:1440px;width:100%}
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.netpill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.netpill.off i{background:var(--bad)} .netpill.sync i{background:var(--hivis)}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;display:inline-grid;place-items:center;color:inherit}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.iconbtn svg{width:20px;height:20px}
.bottomnav{display:none}

/* ---------- Papan proyek (elemen khas) ---------- */
.board{position:relative;background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px 20px 18px 28px;overflow:hidden;margin-bottom:18px}
.board::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 10px,#1A2533 10px 20px)}
.board h1{font-size:clamp(1.35rem,2.6vw,2rem);letter-spacing:.015em}
.board .code{font-family:var(--font-head);font-size:.95rem;color:var(--hivis);letter-spacing:.06em}
.board .meta{opacity:.82;font-size:.9rem;margin-top:2px}
.board-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:end}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .bar{height:12px;background:rgba(255,255,255,.14);border-radius:6px;position:relative;overflow:hidden}
.gauge .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--hivis);border-radius:6px}
.gauge .bar .plan{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.gauge .lbl{display:flex;justify-content:space-between;font-size:.82rem;opacity:.9}
.gauge .big{font-family:var(--font-head);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- Komponen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin-right:auto}
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);padding:12px 14px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--font-head);font-size:1.32rem;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:.92rem;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:550}
.tabs button.active{color:var(--text);border-bottom-color:var(--hivis)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;font-weight:550}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge{background:var(--hivis);color:var(--hivis-ink);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.progress{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--ok)}
.progress.warn>div{background:var(--hivis)} .progress.bad>div{background:var(--bad)}

/* ---------- Tabel ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.82rem}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl .acts .btn{margin-left:4px}
.tbl tr.neg td{color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-weight:600}

/* ---------- Kavling ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.unit:hover{border-color:var(--ink-2)}
.unit .no{font-family:var(--font-head);font-size:1.35rem;line-height:1}
.unit .t{font-size:.82rem;color:var(--muted)}
.unit .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.8rem;color:var(--muted)}
.unit .foot span{white-space:nowrap}

/* ---------- Jejak dokumen ---------- */
.trace{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;counter-reset:t}
.trace .st{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);position:relative}
.trace .st .n{font-family:var(--font-head);font-size:.8rem;color:var(--muted)}
.trace .st .d{font-size:.8rem;overflow-wrap:anywhere;font-weight:600}
.trace .st.miss{background:var(--surface-2);border-style:dashed}
.trace .st.miss .d{color:var(--muted);font-weight:400}
.trace .st.done{box-shadow:inset 0 3px 0 var(--ok)}

/* ---------- Peringatan ---------- */
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.9rem;border-left:4px solid var(--info)}
.alert.warn{border-left-color:var(--hivis)} .alert.danger{border-left-color:var(--bad)}

/* ---------- Grafik ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.chart .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

/* ---------- Form & modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,32,.5);z-index:1100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:960px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin-right:auto}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.84rem;font-weight:600}
.field .help{font-size:.78rem;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:40px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ink-2);outline:2px solid var(--ink-soft)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:20px;height:20px;min-height:0}
.req{color:var(--bad)}
.err-box{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
.rows-ed table{width:100%;border-collapse:collapse;font-size:.88rem}
.rows-ed td{padding:3px}
.rows-ed input,.rows-ed select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface);min-height:34px}
.photo-btn{position:relative;display:inline-flex;align-self:flex-start}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo-prev{display:block;margin-top:8px;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:1300;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:.9rem;border-left:4px solid var(--hivis)}
.toast.err{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:45}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--hivis);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.dsr{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dsr:last-child{border-bottom:0}
.dsr img{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.dsr .ph{width:120px;height:90px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.gantt{display:grid;gap:6px}
.gantt .gr{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;font-size:.85rem}
.gantt .track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.gantt .track .pl{position:absolute;top:3px;bottom:3px;background:var(--ink-soft);border:1px solid var(--ink-2);border-radius:3px}
.gantt .track .ac{position:absolute;top:6px;bottom:6px;background:var(--hivis);border-radius:2px}
.gantt .track .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 14px,#1A2533 14px 28px)}
.login-art h1{font-size:clamp(2rem,4vw,3.2rem);max-width:12ch;line-height:1.05}
.login-art p{max-width:46ch;opacity:.85}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--surface)}
.login-form form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.blueprint{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

/* ---------- Print ---------- */
#print-root{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.toasts,.modal-bg{display:none!important}
  #print-root{display:block}
  .doc{font:11pt/1.45 "Times New Roman",serif;color:#000;padding:0}
  .doc h1{font:700 15pt Arial,sans-serif;margin:0}
  .doc h2{font:700 12.5pt Arial,sans-serif;text-align:center;text-decoration:underline;margin:14px 0 4px}
  .doc .hdr{border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px}
  .doc table{width:100%;border-collapse:collapse;margin:8px 0}
  .doc td,.doc th{border:1px solid #000;padding:4px 6px;font-size:10pt;text-align:left}
  .doc .r{text-align:right}
  .doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;text-align:center}
  .doc .sign div{min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
  @page{size:A4;margin:16mm}
}


/* ---------- Denah & brosur ---------- */
.modal.full{max-width:1320px;height:92vh;max-height:92vh}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
.ed-canvas{background:#DDE2E7;overflow:auto;padding:12px;display:flex;align-items:flex-start;justify-content:center;min-height:0}
.ed-canvas svg{width:100%;max-width:100%;height:auto;max-height:calc(92vh - 150px);background:#fff;box-shadow:var(--shadow);touch-action:none;user-select:none}
.ed-side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;min-height:0}
.ed-side .form{grid-template-columns:1fr 1fr}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.plan-thumb{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;height:230px;display:flex;justify-content:center}
.plan-thumb svg{height:100%;width:auto;max-width:100%}
.plan-thumb.big{height:auto}.plan-thumb.big svg{height:auto;width:100%}
.br-thumb{height:160px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.br-thumb svg,.br-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.br-preview{flex:1;overflow:auto;background:#7A8591;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:0}
.br-preview .br-page{box-shadow:0 6px 24px rgba(0,0,0,.35);flex:none}
.br-preview .brochure{display:flex;flex-direction:column;align-items:center;gap:16px}
@media (max-width:860px){
  .modal.full{height:96vh;max-height:96vh}
  .ed{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .ed-canvas{padding:6px}
  .ed-canvas svg{max-height:58vh}
  .ed-side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .cards-grid{grid-template-columns:1fr}
  .modal.full .modal-h{flex-wrap:wrap}
  #edHint{display:none}
}

/* ---------- Kinerja, versi & legal ---------- */
html.busy::before{content:"";position:fixed;left:0;top:0;height:3px;width:40%;background:var(--hivis);z-index:90;animation:busybar 1.1s ease-in-out infinite}
@keyframes busybar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.side-link{color:#D5DFEA;text-decoration:underline;text-underline-offset:2px}

  if (!p || p.deletedAt) throw new AppError(404, 'PROJECT_NOT_FOUND', 'Proyek tidak ditemukan.');
  if (action) assertPerm_(actor, action);
  if (!isMember_(actor, projectId)) {
    throw new AppError(403, 'PROJECT_AUTHORIZATION_DENIED', 'Akses ditolak: ' + actor.fullName + ' bukan anggota proyek ' + p.code + '.');
  }
  return p;
}

/* ============================ Validasi ============================ */
var V = {
  str: function (v, label, max) {
    var s = (v === null || v === undefined) ? '' : String(v).trim();
    if (!s) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" wajib diisi.');
    if (max && s.length > max) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" maksimal ' + max + ' karakter.');
    return s;
  },
  opt: function (v, max) { var s = (v === null || v === undefined) ? '' : String(v).trim(); return max ? s.slice(0, max) : s; },
  pos: function (v, label) {
    if (v === null || v === undefined || String(v).trim() === '' || isNaN(Number(String(v).replace(/,/g, '')))) {
      throw new AppError(400, 'VALIDATION_ERROR', 'Kolom angka "' + label + '" wajib diisi dengan angka.');
    }
    if (!D.isPos(v)) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" harus lebih besar dari 0.');
    return String(v).replace(/,/g, '').trim();
  },
  nonneg: function (v, label) {
    var s = (v === null || v === undefined || String(v).trim() === '') ? '0' : String(v).replace(/,/g, '').trim();
    if (isNaN(Number(s))) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" harus berupa angka.');
    if (D.isNeg(s)) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" tidak boleh negatif.');
    return s;
  },
  pct: function (v, label) {
    var s = V.nonneg(v, label);
    if (D.cmp(s, '100') > 0) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom "' + label + '" harus 0–100%.');
    return D.money(s);
  },
  date: function (v, label) {
    var s = String(v || '').slice(0, 10);
    if (!isIsoDate_(s)) throw new AppError(400, 'VALIDATION_ERROR', 'Kolom tanggal "' + label + '" wajib diisi (format YYYY-MM-DD).');
    return s;
  },
  oneOf: function (v, list, label) {
    if (list.indexOf(v) < 0) throw new AppError(400, 'VALIDATION_ERROR', 'Nilai "' + label + '" tidak valid.');
    return v;
  },
  email: function (v) {
    var s = String(v || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) throw new AppError(400, 'VALIDATION_ERROR', 'Format email tidak valid.');
    return s;
  }
};

/* ============================ Penomoran dokumen ============================ */
/** Nomor dokumen: TYPE/KODEPT/YYYY/MM-#### dengan counter per tipe per bulan (aman dari duplikasi) */
function nextDocNo_(tx, type, extra) {
  var s = getSettings_();
  var td = today_();
  var yyyy = td.slice(0, 4), mm = td.slice(5, 7);
  var key = type + '-' + yyyy + mm;
  var c = Db.find('Counters', function (r) { return r.key === key; });
  var n;
  if (c) { c.value = Number(c.value) + 1; c.updatedAt = nowIso_(); tx.update('Counters', c); n = c.value; }
  else { n = 1; tx.insert('Counters', { key: key, value: 1, updatedAt: nowIso_() }); }
  var seq = String(n); while (seq.length < 4) seq = '0' + seq;
  return type + '/' + (s.companyCode || 'HCE') + (extra ? '/' + extra : '') + '/' + yyyy + '/' + mm + '-' + seq;
}

/* ============================ Audit trail ============================ */
var LAST_AUDIT_ = null;
function resetMemo_() { LAST_AUDIT_ = null; JC_MEMO_ = {}; }
/** Ujung rantai audit: dari transaksi berjalan → tabel yang sudah dimuat → properti AUDIT_TAIL → pindai tabel */
function lastAudit_() {
  if (LAST_AUDIT_) return LAST_AUDIT_;
  if (!Db.loaded('AuditLogs')) {
    try { var p = PropertiesService.getScriptProperties().getProperty('AUDIT_TAIL'); if (p) { LAST_AUDIT_ = JSON.parse(p); return LAST_AUDIT_; } } catch (e) { }
  }
  return scanAuditTail_();
}
function scanAuditTail_() {
  var rows = Db.all('AuditLogs'); var best = null;
  for (var i = 0; i < rows.length; i++) if (!best || Number(rows[i].seq) > Number(best.seq)) best = rows[i];
  LAST_AUDIT_ = best ? { seq: best.seq, integrityHash: best.integrityHash } : null;
  try { if (best) PropertiesService.getScriptProperties().setProperty('AUDIT_TAIL', JSON.stringify(LAST_AUDIT_)); else PropertiesService.getScriptProperties().deleteProperty('AUDIT_TAIL'); } catch (e) { }
  return LAST_AUDIT_;
}
function auditHashPayload_(a) {
  return JSON.stringify([a.prevHash, Number(a.seq), a.projectId || '', a.houseUnitId || '', a.actorUserId, a.action,
    a.entityType, a.entityId, a.sourceReference || '', a.summary || '', a.beforeJson || '', a.afterJson || '', a.createdAt]);
}
function audit_(tx, actor, p) {
  var last = lastAudit_();
  var entry = {
    id: uid_('aud'),
    seq: last ? Number(last.seq) + 1 : 1,
    projectId: p.projectId || '',
    houseUnitId: p.houseUnitId || '',
    actorUserId: actor ? actor.id : 'SYSTEM',
    actorName: actor ? actor.fullName : 'SYSTEM',
    actorRole: actor ? actor.role : 'SYSTEM',
    action: p.action,
    entityType: p.entityType,
    entityId: p.entityId || '',
    sourceReference: String(p.sourceReference || ''),
    summary: String(p.summary || ''),
    beforeJson: p.before ? JSON.stringify(p.before) : '',
    afterJson: p.after ? JSON.stringify(p.after) : '',
    prevHash: last ? last.integrityHash : APP.AUDIT_GENESIS,
    createdAt: nowIso_()
  };
  entry.integrityHash = sha256Hex_(auditHashPayload_(entry));
  if (Db.loaded('AuditLogs')) tx.insert('AuditLogs', entry); else tx.insertQuiet('AuditLogs', entry);
  LAST_AUDIT_ = { seq: entry.seq, integrityHash: entry.integrityHash };
  tx.lastAudit = LAST_AUDIT_;
  return entry;
}
function verifyAuditChain_() {
  var logs = Db.fresh('AuditLogs').slice().sort(function (a, b) { return Number(a.seq) - Number(b.seq); });
  var prev = APP.AUDIT_GENESIS, breaks = [], ok = 0;
  for (var i = 0; i < logs.length; i++) {
    var l = logs[i];
    var calc = sha256Hex_(auditHashPayload_(l));
    var linkOk = l.prevHash === prev;
    if (calc !== l.integrityHash || !linkOk) {
      breaks.push({ seq: l.seq, logId: l.id, action: l.action, expectedPrevHash: prev, recordedPrevHash: l.prevHash, calculatedHash: calc, recordedHash: l.integrityHash });
    } else ok++;
    prev = l.integrityHash;
  }
  return { chainValid: breaks.length === 0, totalLogsScanned: logs.length, verifiedCount: ok, genesisHash: APP.AUDIT_GENESIS, latestHash: prev, chainBreaks: breaks.slice(0, 50), verifiedAt: nowIso_() };
}

/* ============================ Lock ============================ */
function withLock_(fn) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(25000)) throw new AppError(503, 'BUSY', 'Server sedang sibuk memproses transaksi lain. Coba beberapa detik lagi.');
  try { if (typeof FAST_ === 'undefined' || !FAST_) Db.reset(); return fn(); }
  finally { lock.releaseLock(); }
}

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.api === 'ping') return json_({ ok: true, data: routes_().ping.fn() });
  if (p.api === 'diag') return json_({ ok: true, data: deploymentDiag_(false) });
  var t = HtmlService.createTemplateFromFile('Index');
  return t.evaluate()
    .setTitle(APP.NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function doPost(e) {
  var req;
  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); }
  catch (err) { return json_({ ok: false, error: { code: 'BAD_JSON', message: 'Body request bukan JSON valid.' } }); }
  return json_(handle_(req));
}

/** dipanggil dari google.script.run */
function api(req) { return handle_(req || {}); }

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function handle_(req) {
  Db.reset(); Notify.clear();
  var started = Date.now();
  try {
    var route = routes_()[req.action];
    if (!route) throw new AppError(404, 'UNKNOWN_ACTION', 'Aksi tidak dikenal: ' + req.action);
    var actor = null;
    if (route.ho) actor = requireHomeowner_(req.token);
    else if (!route.pub) actor = requireSession_(req.token);
    if (route.w) {
      if (!route.allowReadOnly) License.assertWritable();
      if (req.opId) {
        var done = Db.find('ClientOps', function (o) { return o.opId === req.opId; });
        if (done) return { ok: true, duplicate: true, data: safeParse_(done.resultJson) };
      }
    }
    var data = route.fn(actor, req.payload || {}, req);
    var boot = null;
    if (route.w && req.refresh && actor && !route.ho) {
      try { boot = bootstrap_(Db.byId('Users', actor.id) || actor, { projectId: req.refresh === true ? '' : String(req.refresh) }); } catch (e) { boot = null; }
    }
    if (route.w && req.opId) {
      withLock_(function () {
        var tx = new Db.Tx();
        var summary = data && typeof data === 'object' ? { id: data.id || (data.invoice && data.invoice.id) || null, number: data.mrNumber || data.poNumber || data.grnNumber || data.reportNumber || data.opnameNumber || data.inspectionNumber || data.claimNumber || data.payrollNumber || data.referenceDocNo || null } : null;
        tx.insert('ClientOps', { opId: String(req.opId).slice(0, 64), userId: actor ? actor.id : '', action: req.action, resultJson: JSON.stringify(summary), createdAt: nowIso_() });
        tx.commit();
      });
    }
    try { Notify.flush(); } catch (e) { }
    var res = { ok: true, data: data, ms: Date.now() - started };
    if (boot) res.boot = boot;
    return res;
  } catch (err) {
    Notify.clear();
    if (err instanceof AppError || (err && err.name === 'AppError')) {
      return { ok: false, error: { code: err.code, message: err.message, status: err.status, details: err.details } };
    }
    console.error(err && err.stack || err);
    return { ok: false, error: { code: 'INTERNAL_ERROR', message: 'Terjadi kesalahan server: ' + (err && err.message ? err.message : String(err)) } };
  }
}

function safeParse_(s) { try { return JSON.parse(s); } catch (e) { return null; } }

function auditList_(actor, p) {
  assertPerm_(actor, 'AUDIT_VIEW');
  var rows = Db.all('AuditLogs').filter(function (a) { return !p.projectId || a.projectId === p.projectId || !a.projectId; });
  if (p.q) { var q = String(p.q).toLowerCase(); rows = rows.filter(function (a) { return (a.summary + ' ' + a.sourceReference + ' ' + a.action + ' ' + a.actorName).toLowerCase().indexOf(q) >= 0; }); }
  rows.sort(function (a, b) { return Number(b.seq) - Number(a.seq); });
  var page = Math.max(1, Number(p.page) || 1), size = Math.min(200, Number(p.pageSize) || 50);
  return { total: rows.length, page: page, pageSize: size, rows: rows.slice((page - 1) * size, page * size).map(function (a) { var o = {}; for (var k in a) o[k] = a[k]; return o; }) };
}

/* ---- License.gs ---- */
/**
 * License.gs — Lisensi berlangganan (dicek ke License Server milik penyedia).
 * - Tanpa kunci: mode TRIAL 30 hari (1 proyek, 10 kavling, 5 pengguna).
 * - Lisensi kedaluwarsa: aplikasi masuk MODE BACA-SAJA (data tetap bisa dilihat & diekspor; tidak ada penguncian data).
 * - Hasil verifikasi di-cache 7 hari + masa tenggang 14 hari bila server lisensi tidak terjangkau.
 *
 * PENYEDIA: isi PROVIDER_LICENSE_URL dengan URL Web App LicenseServer sebelum dikirim ke klien.
 */
var PROVIDER_LICENSE_URL = '';   // contoh: 'https://script.google.com/macros/s/XXXX/exec'

var TIERS = {
  TRIAL: { label: 'Trial 30 hari', projects: 1, units: 10, users: 5 },
  STARTER: { label: 'Starter', projects: 2, units: 40, users: 8 },
  PROFESSIONAL: { label: 'Professional', projects: 10, units: 300, users: 30 },
  ENTERPRISE: { label: 'Enterprise', projects: 100000, units: 1000000, users: 100000 }
};

var License = (function () {
  var props = function () { return PropertiesService.getScriptProperties(); };

  function cache() { try { return JSON.parse(props().getProperty('LICENSE_CACHE') || 'null'); } catch (e) { return null; } }

  function status() {
    var c = cache();
    var now = nowIso_();
    if (c && c.valid) {
      var expired = c.expiresAt && c.expiresAt.slice(0, 10) < now.slice(0, 10);
      var stale = c.checkedAt && (Date.now() - new Date(c.checkedAt).getTime()) > 21 * 86400000;
      var t = TIERS[c.tier] || TIERS.STARTER;
      return { mode: (expired || stale) ? 'READ_ONLY' : 'LICENSED', tier: c.tier, tierLabel: t.label, licensee: c.licensee || '', expiresAt: c.expiresAt || '', checkedAt: c.checkedAt, limits: t, message: expired ? 'Lisensi telah berakhir. Aplikasi dalam mode baca-saja; hubungi penyedia untuk perpanjangan.' : (stale ? 'Lisensi belum terverifikasi > 21 hari. Hubungkan internet & klik Verifikasi Lisensi.' : '') };
    }
    var start = props().getProperty('TRIAL_START');
    if (!start) { start = now; props().setProperty('TRIAL_START', start); }
    var end = addDays_(start.slice(0, 10), 30);
    var expiredT = end < now.slice(0, 10);
    return { mode: expiredT ? 'READ_ONLY' : 'TRIAL', tier: 'TRIAL', tierLabel: TIERS.TRIAL.label, licensee: '', expiresAt: end, limits: TIERS.TRIAL, message: expiredT ? 'Masa trial berakhir. Masukkan kunci lisensi di menu Admin → Lisensi.' : 'Mode trial hingga ' + end + '.' };
  }

  function assertWritable() {
    var s = status();
    if (s.mode === 'READ_ONLY') throw new AppError(402, 'LICENSE_READ_ONLY', s.message || 'Lisensi tidak aktif — mode baca-saja.');
  }

  function assertLimit(kind, wanted) {
    if (typeof FAST_ !== 'undefined' && FAST_) return;
    var s = status();
    var lim = s.limits[kind];
    if (lim && wanted > lim) throw new AppError(402, 'LICENSE_LIMIT', 'Batas paket ' + s.tierLabel + ' untuk ' + kind + ' adalah ' + lim + '. Upgrade lisensi untuk menambah.');
  }

  function serverUrl() {
    var s = getSettings_();
    return s.licenseServerUrl || PROVIDER_LICENSE_URL;
  }

  function verify(key) {
    var url = serverUrl();
    if (!url) throw new AppError(400, 'NO_LICENSE_SERVER', 'URL server lisensi belum diatur oleh penyedia.');
    var ssId = ''; try { ssId = Db.ss().getId(); } catch (e) { }
    var q = '?action=verify&key=' + encodeURIComponent(key) + '&sid=' + encodeURIComponent(ScriptApp.getScriptId()) + '&ssid=' + encodeURIComponent(ssId) + '&v=' + APP.VERSION;
    var res = UrlFetchApp.fetch(url + q, { muteHttpExceptions: true, followRedirects: true });
    var body = {};
    try { body = JSON.parse(res.getContentText()); } catch (e) { throw new AppError(502, 'LICENSE_SERVER_ERROR', 'Respons server lisensi tidak valid.'); }
    if (!body.ok) throw new AppError(400, 'LICENSE_INVALID', body.message || 'Kunci lisensi tidak valid.');
    var c = { valid: true, key: key, tier: body.tier, licensee: body.licensee, expiresAt: body.expiresAt, checkedAt: nowIso_() };
    props().setProperty('LICENSE_CACHE', JSON.stringify(c));

  }

  function activate(actor, p) {
    assertPerm_(actor, 'COMPANY_MANAGE');
    var key = V.str(p.licenseKey, 'Kunci lisensi', 80).toUpperCase();
    var c = verify(key);
    mut_(function (tx) {
      setSetting_(tx, 'licenseKey', key);
      audit_(tx, actor, { action: 'LICENSE_ACTIVATED', entityType: 'License', entityId: key.slice(0, 9), sourceReference: c.tier, summary: 'Aktivasi lisensi ' + c.tier + ' a.n. ' + c.licensee + ' s/d ' + c.expiresAt + '.', after: { tier: c.tier, expiresAt: c.expiresAt } });
      return null;
    });
    return status();
  }

  /** dipanggil trigger harian */
  function refresh() {
    var key = getSettings_().licenseKey;
    if (!key) return status();
    try { verify(key); } catch (e) {
      var c = cache();
      if (c && e.code === 'LICENSE_INVALID') { c.valid = false; props().setProperty('LICENSE_CACHE', JSON.stringify(c)); }
    }
    return status();
  }

  return { status: status, assertWritable: assertWritable, assertLimit: assertLimit, activate: activate, refresh: refresh };
})();

/* ============================ Templat pesan ============================ */
var REMINDER_TEMPLATE_DEFAULT = 'Yth. {nama},\n\nPengingat tagihan {termin} untuk rumah {kavling} di {proyek}.\nNomor tagihan: {noTagihan}\nSisa tagihan: {nominal}\nJatuh tempo: {jatuhTempo} ({keterangan})\n\nPembayaran ke: {rekening}\nMohon cantumkan nomor tagihan pada berita transfer.\n\nRiwayat termin & progres rumah: {portal}\n\nAbaikan pesan ini bila sudah membayar. Terima kasih.\n{perusahaan}';

  return '';
}

  var sent = {}; Db.all('Notifications').forEach(function (n) { if (n.dedupKey && n.status === 'SENT') sent[n.dedupKey] = 1; });
  var plan = [], staff = [];
  Db.where('Invoices', function (i) { return i.invoiceType === 'AR_PROGRESS_BILLING' && i.status !== STATUS.VOID && D.isPos(D.sub(i.netAmount, i.paidAmount)) && (!opts.projectId || i.projectId === opts.projectId); }).forEach(function (inv) {
    var dd = daysBetween_(today, inv.dueDate);
    var slot = dd >= 0 ? (before.indexOf(dd) >= 0 ? 'B' + dd : null) : (after.indexOf(-dd) >= 0 ? 'A' + (-dd) : null);
    if (opts.invoiceId) { if (inv.id !== opts.invoiceId) return; slot = 'M' + today; }
    if (!slot) return;
    var prj = Db.byId('Projects', inv.projectId), unit = inv.houseUnitId ? Db.byId('HouseUnits', inv.houseUnitId) : null;
    if (inv.billTo === 'BANK') { staff.push((prj ? prj.code : '') + ' ' + inv.invoiceNumber + ' (bank KPR) ' + rupiah_(D.sub(inv.netAmount, inv.paidAmount)) + (dd < 0 ? ' TELAT ' + (-dd) + ' hr' : ' jt ' + inv.dueDate)); return; }
    var rec = unit ? unitRecipients_(unit) : [];
    if (!rec.length) { plan.push({ inv: inv, skip: 'Tidak ada nomor WA/email konsumen' }); return; }
    rec.forEach(function (r) {
      var text = reminderMessage_(s, inv, unit, prj, r.name, today);
      var base = { kind: 'DUE_REMINDER', name: r.name, projectId: inv.projectId, refType: 'Invoice', refId: inv.id, refNo: inv.invoiceNumber };
      if (r.phone) { var k1 = 'DUE:' + inv.id + ':' + slot + ':WA:' + r.phone; if (!sent[k1]) plan.push({ inv: inv, ch: 'WA', to: r.phone, text: text, meta: Object.assign({ dedupKey: k1 }, base) }); }
      if (r.email) { var k2 = 'DUE:' + inv.id + ':' + slot + ':EM:' + r.email; if (!sent[k2]) plan.push({ inv: inv, ch: 'EMAIL', to: r.email, subject: 'Pengingat tagihan ' + inv.invoiceNumber + ' — ' + (unit ? unit.unitNumber : ''), text: text, meta: Object.assign({ dedupKey: k2 }, base) }); }
    });
  });
  var preview = plan.filter(function (p) { return !p.skip; }).map(function (p) { return { channel: p.ch, to: p.to, name: p.meta.name, invoiceNumber: p.inv.invoiceNumber, dueDate: p.inv.dueDate, text: p.text }; });
  var skipped = plan.filter(function (p) { return p.skip; }).map(function (p) { return { invoiceNumber: p.inv.invoiceNumber, reason: p.skip }; });
  if (opts.dryRun) return { dryRun: true, messages: preview, skipped: skipped, staffLines: staff };
  if (s.customerReminders === 'OFF' && !opts.invoiceId) { preview = []; } else {
    plan.forEach(function (p) { if (p.skip) return; if (p.ch === 'WA') Notify.wa(p.to, p.text, p.meta); else Notify.email(p.to, p.subject, p.text, p.meta); });
  }
  if (staff.length && !opts.invoiceId) Notify.queue('Tagihan bank KPR jatuh tempo/terlambat:\n' + staff.slice(0, 15).join('\n'));
  var touched = {}; plan.forEach(function (p) { if (!p.skip) touched[p.inv.id] = p.inv; });
  var ok = Notify.flush();
  var ids = Object.keys(touched);
  if (ids.length) {
    try {
      withLock_(function () {
        var tx = new Db.Tx();
        ids.forEach(function (id) { var inv = Db.byId('Invoices', id); if (inv) { inv.lastReminderAt = nowIso_(); inv.reminderCount = (Number(inv.reminderCount) || 0) + 1; tx.update('Invoices', inv); } });
        tx.commit();
      });
    } catch (e) { }
  }
  return { sent: ok, planned: preview.length, skipped: skipped, staffLines: staff.length };
}

function evm_(projectId, asOf) {
  var prj = Db.byId('Projects', projectId);
  var units = Db.where('HouseUnits', function (u) { return u.projectId === projectId && !u.deletedAt; });
  var wbs = Db.where('WbsItems', function (w) { return w.projectId === projectId; });
  var jc = jobCosting_(projectId);
  var t = asOf || today_();
  var bac = '0.00', ev = '0.00', pv = '0.00';
  units.forEach(function (u) {
    var rab = D.isPos(u.rabRevisedAmount) ? u.rabRevisedAmount : u.rabBaselineAmount;
    var own = wbs.filter(function (w) { return w.houseUnitId === u.id; });
    var list = own.length ? own : wbs.filter(function (w) { return !w.houseUnitId; });
    bac = D.add(bac, rab);
    ev = D.add(ev, D.pct(rab, u.progressPercent));
    pv = D.add(pv, D.pct(rab, plannedPctAt_(t, list, prj)));
  });
  if (!D.isPos(bac)) bac = prj.revisedBudget;
  var ac = jc.totalActualCost;
  var cpi = D.isPos(ac) ? D.div(ev, ac) : '1.00';
  var spi = D.isPos(pv) ? D.div(ev, pv) : '1.00';
  var eac = D.isPos(cpi) ? D.divMoney(bac, cpi) : bac;
  var rec = [], status;
  var c1 = D.cmp(cpi, '1') >= 0, s1 = D.cmp(spi, '1') >= 0;
  if (c1 && s1) { status = 'ON_TRACK_UNDER_BUDGET'; rec.push('Progres fisik sesuai/mendahului jadwal dan biaya terkendali. Pertahankan ritme pengadaan & subkon.'); }
  else if (c1 && !s1) { status = 'BEHIND_UNDER_BUDGET'; rec.push('Jadwal tertinggal namun biaya masih efisien. Pertimbangkan tambah tenaga/lembur atau percepat pengadaan pada WBS kritis.'); }
  else if (!c1 && s1) { status = 'AHEAD_OVER_BUDGET'; rec.push('Progres cepat tetapi biaya melebihi nilai hasil (CPI < 1). Audit pemakaian material & volume opname.'); }
  else { status = 'CRITICAL_DELAY_OVER_BUDGET'; rec.push('KRITIS: terlambat dan boros sekaligus. Lakukan rapat evaluasi, revisi jadwal WBS, dan kaji CCO.'); }
  if (D.cmp(D.sub(bac, eac), '0') < 0) rec.push('Proyeksi biaya akhir (EAC Rp ' + eac + ') melebihi anggaran; siapkan rencana penghematan atau adendum.');
  var actualPct = D.ratioPct(ev, bac), plannedPct = D.ratioPct(pv, bac);
  return {
    projectId: projectId, projectCode: prj.code, projectName: prj.name, asOf: t, bac: bac, plannedProgressPct: plannedPct, actualProgressPct: actualPct,
    pv: pv, ev: ev, ac: ac, cv: D.sub(ev, ac), sv: D.sub(ev, pv), cpi: cpi, spi: spi, eac: eac, etc: D.sub(eac, ac), vac: D.sub(bac, eac),
    tcpi: D.isPos(D.sub(bac, ac)) ? D.div(D.sub(bac, ev), D.sub(bac, ac)) : '0.00',
    performanceStatus: status, recommendations: rec, sCurve: sCurve_(prj, units, wbs), generatedAt: nowIso_()
  };
}

/** Kurva-S bulanan: rencana (time-phased), aktual (dari riwayat laporan harian), biaya aktual % BAC */
function sCurve_(prj, units, wbs) {
  var start = prj.startDate, end = prj.targetEndDate;
  if (!isIsoDate_(start) || !isIsoDate_(end)) return [];
  var pts = [], d = start.slice(0, 7) + '-01', guard = 0;
  var dsr = Db.where('DailyReports', function (r) { return r.projectId === prj.id; });
  var costRows = [];
  Db.where('StockLedger', function (l) { return l.projectId === prj.id && l.movementType === 'PROJECT_ISSUE'; }).forEach(function (l) { costRows.push([l.createdAt.slice(0, 10), l.totalCost]); });
  Db.where('WorkOpnames', function (o) { return o.projectId === prj.id && (o.status === STATUS.APPROVED || o.status === STATUS.POSTED); }).forEach(function (o) { costRows.push([o.createdAt.slice(0, 10), o.grossEarnedAmount]); });
  Db.where('PayrollEntries', function (e) { return e.projectId === prj.id && e.status === STATUS.POSTED; }).forEach(function (e) { costRows.push([e.periodEnd, e.totalPay]); });
  Db.where('Invoices', function (i) { return i.projectId === prj.id && i.invoiceType === 'AP_OTHER' && i.status !== STATUS.VOID; }).forEach(function (i) { costRows.push([i.invoiceDate, i.grossAmount]); });
  var bac = '0.00'; units.forEach(function (u) { bac = D.add(bac, D.isPos(u.rabRevisedAmount) ? u.rabRevisedAmount : u.rabBaselineAmount); });
  var today = today_();
  while (guard++ < 72) {
    var monthEnd = addDays_(addMonths_(d, 1), -1);
    var t = monthEnd > end ? end : monthEnd;
    var pv = '0.00', ev = '0.00';
    units.forEach(function (u) {
      var rab = D.isPos(u.rabRevisedAmount) ? u.rabRevisedAmount : u.rabBaselineAmount;
      var own = wbs.filter(function (w) { return w.houseUnitId === u.id; });
      pv = D.add(pv, D.pct(rab, plannedPctAt_(t, own.length ? own : wbs.filter(function (w) { return !w.houseUnitId; }), prj)));
      var last = null; dsr.forEach(function (r) { if (r.houseUnitId === u.id && r.reportDate <= t && (!last || r.reportDate >= last.reportDate)) last = r; });
      var pct = last ? last.cumulativeProgressPct : '0';
      if (t >= today) pct = u.progressPercent;
      if (u.handoverDate && u.handoverDate <= t) pct = '100';
      ev = D.add(ev, D.pct(rab, pct));
    });
    var ac = '0.00'; costRows.forEach(function (c) { if (c[0] && c[0] <= t) ac = D.add(ac, c[1]); });
    var pt = { period: d.slice(0, 7), date: t, plannedPct: D.ratioPct(pv, bac) };
    if (d <= today) { pt.actualPct = D.ratioPct(ev, bac); pt.costPct = D.ratioPct(ac, bac); }
    pts.push(pt);
    if (monthEnd >= end) break;
    d = addMonths_(d, 1);
  }
  return pts;
}

function cashSummary_(projectId) {
  var r = { apInvoiced: '0.00', apPaid: '0.00', arBilled: '0.00', arCollected: '0.00', cashIn: '0.00', cashOut: '0.00', unreconciled: 0 };
  Db.where('Invoices', function (i) { return i.projectId === projectId && i.status !== STATUS.VOID; }).forEach(function (i) {
    if (i.invoiceType === 'AR_PROGRESS_BILLING') { r.arBilled = D.add(r.arBilled, i.netAmount); r.arCollected = D.add(r.arCollected, i.paidAmount); }
    else { r.apInvoiced = D.add(r.apInvoiced, i.netAmount); r.apPaid = D.add(r.apPaid, i.paidAmount); }
  });
  Db.where('Payments', function (p) { return p.projectId === projectId; }).forEach(function (p) {
    if (p.paymentDirection === 'INFLOW_AR') r.cashIn = D.add(r.cashIn, p.amount); else r.cashOut = D.add(r.cashOut, p.amount);
    if (!p.reconciled) r.unreconciled++;
  });
  r.netCashflow = D.sub(r.cashIn, r.cashOut);
  return r;
}

function alerts_(actor, projectId) {
  var out = [];

  if (mrs.length && perm_(actor.role, 'MR_APPROVE')) out.push({ level: 'warn', module: 'pengadaan', text: mrs.length + ' Material Request menunggu persetujuan.' });

  var rabs = Db.where('RabBudgets', function (b) { return b.projectId === projectId && b.status === STATUS.SUBMITTED; });
  if (rabs.length && perm_(actor.role, 'RAB_APPROVE')) out.push({ level: 'warn', module: 'rab', text: rabs.length + ' revisi RAB menunggu persetujuan.' });
  var ops = Db.where('WorkOpnames', function (o) { return o.projectId === projectId && o.status === STATUS.SUBMITTED; });
  if (ops.length && perm_(actor.role, 'OPNAME_APPROVE')) out.push({ level: 'warn', module: 'lapangan', text: ops.length + ' opname menunggu persetujuan.' });
  var opA = Db.where('WorkOpnames', function (o) { return o.projectId === projectId && o.status === STATUS.APPROVED; });
  if (opA.length && perm_(actor.role, 'FINANCE_PAYMENT_POST')) out.push({ level: 'info', module: 'keuangan', text: opA.length + ' termin opname siap dicairkan.' });
  var mats = {}; Db.live('Materials').forEach(function (m) { mats[m.id] = m; });
  var whs = {}; Db.live('Warehouses').forEach(function (w) { whs[w.id] = w; });
  stockBalances_().forEach(function (b) {
    var m = mats[b.materialId], w = whs[b.warehouseId];
    if (m && w && D.isPos(m.minStockLevel) && D.cmp(b.qty, m.minStockLevel) < 0 && (!w.projectId || w.projectId === projectId)) {
      out.push({ level: 'warn', module: 'gudang', text: 'Stok ' + m.name + ' di ' + w.name + ' tinggal ' + String(Number(b.qty)).replace('.', ',') + ' ' + m.unit + ' (minimum ' + String(Number(m.minStockLevel)).replace('.', ',') + ').' });
    }
  });
  var ag = agingReport_(projectId);

  if (overdue.length) out.push({ level: 'danger', module: 'keuangan', text: overdue.length + ' faktur lewat jatuh tempo (terlama ' + overdue[0].daysOverdue + ' hari: ' + overdue[0].invoiceNumber + ').' });
  var defects = Db.where('QcInspections', function (q) { return q.projectId === projectId && (q.defectStatus === 'OPEN' || q.defectStatus === 'RECTIFIED'); });
  if (defects.length) out.push({ level: 'warn', module: 'qc', text: defects.length + ' defect QC belum ditutup.' });
  var claims = Db.where('WarrantyClaims', function (c) { return c.projectId === projectId && c.repairStatus !== 'RESOLVED'; });
  if (claims.length) out.push({ level: 'warn', module: 'qc', text: claims.length + ' klaim garansi belum selesai.' });
  var jc = jobCosting_(projectId);
  jc.units.forEach(function (u) {
    if (D.isNeg(u.costVariance)) out.push({ level: 'danger', module: 'laporan', text: 'Kavling ' + u.unitNumber + ' over budget Rp ' + D.money(D.sub('0', u.costVariance)) + '.' });
    else if (D.cmp(u.costToProgressRatio, '1.15') > 0 && D.cmp(u.progressPercent, '10') > 0) out.push({ level: 'warn', module: 'laporan', text: 'Kavling ' + u.unitNumber + ': biaya ' + u.costToProgressRatio + '× nilai progres (indikasi boros).' });
  });
  return out;
}

function saveAhsp_(actor, p) {
  assertPerm_(actor, 'MASTER_MANAGE');
  return mut_(function (tx) {
    var code = V.str(p.code, 'Kode AHSP', 30).toUpperCase();
    notDup_('AhspTemplates', 'code', code, p.id, 'Kode AHSP');
    var comps = p.components;
    if (typeof comps === 'string') { try { comps = JSON.parse(comps); } catch (e) { comps = null; } }
    if (!comps || !comps.length) throw new AppError(400, 'VALIDATION_ERROR', 'AHSP wajib memiliki minimal 1 komponen koefisien.');
    var matCost = '0.00', labCost = '0.00';
    var norm = comps.map(function (c, i) {
      var type = V.oneOf(String(c.resourceType || 'MATERIAL').toUpperCase(), ['MATERIAL', 'LABOR', 'EQUIPMENT'], 'Jenis sumber daya baris ' + (i + 1));
      var coef = D.qty(V.pos(c.coefficient, 'Koefisien baris ' + (i + 1)));
      var price = D.money(V.pos(c.unitPrice, 'Harga satuan baris ' + (i + 1)));
      var line = D.mul(coef, price);
      if (type === 'LABOR') labCost = D.add(labCost, line); else matCost = D.add(matCost, line);
      return { resourceCode: V.str(c.resourceCode, 'Kode sumber daya baris ' + (i + 1), 30).toUpperCase(), resourceName: V.str(c.resourceName, 'Nama sumber daya baris ' + (i + 1), 150), resourceType: type, coefficient: coef, unit: V.str(c.unit, 'Satuan baris ' + (i + 1), 20), unitPrice: price };
    });
    var oh = V.pct(p.overheadPercent || '10', 'Overhead');
    var direct = D.add(matCost, labCost);
    var a = p.id ? Db.byId('AhspTemplates', p.id) : null;
    var before = a ? JSON.parse(JSON.stringify(a)) : null;
    if (!a) a = tx.insert('AhspTemplates', { id: uid_('ahsp'), createdAt: nowIso_(), deletedAt: '' });
    a.code = code; a.name = V.str(p.name, 'Uraian AHSP', 200); a.workCategory = V.str(p.workCategory, 'Kategori pekerjaan', 80).toUpperCase();
    a.unit = V.str(p.unit, 'Satuan', 20); a.materialCost = matCost; a.laborCost = labCost; a.overheadPercent = oh;
    a.unitPrice = D.add(direct, D.pct(direct, oh)); a.components = norm;
    tx.update('AhspTemplates', a);
    audit_(tx, actor, { action: before ? 'MASTER_AHSP_UPDATED' : 'MASTER_AHSP_CREATED', entityType: 'AhspTemplate', entityId: a.id, sourceReference: a.code, summary: 'AHSP ' + a.code + ' (' + a.name + '): harga satuan Rp ' + a.unitPrice + '/' + a.unit + '.', before: before, after: a });
    return a;
  });
}

/** Ajukan RAB baseline/revisi (CCO) untuk sebuah kavling. Auto-approve bila pengaju punya RAB_APPROVE. */
function submitRab_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'RAB_CREATE');
    var unit = Db.byId('HouseUnits', p.houseUnitId);
    if (!unit || unit.projectId !== prj.id || unit.deletedAt) throw new AppError(404, 'UNIT_NOT_FOUND', 'Kavling tidak ditemukan pada proyek ini.');
    var items = p.items || [{ wbsCode: p.wbsCode, ahspCode: p.ahspCode, workDescription: p.workDescription, volume: p.volume }];
    if (!items.length) throw new AppError(400, 'VALIDATION_ERROR', 'Minimal 1 item pekerjaan.');
    var reason = V.str(p.revisionReason, 'Alasan / keterangan', 300);
    var budgets = Db.where('RabBudgets', function (b) { return b.houseUnitId === unit.id; });
    var pending = budgets.filter(function (b) { return b.status === STATUS.SUBMITTED; });
    if (pending.length) throw new AppError(409, 'RAB_PENDING_EXISTS', 'Masih ada RAB ' + pending[0].documentNumber + ' menunggu persetujuan untuk kavling ini.');
    var hasApprovedItems = Db.where('RabItems', function (i) { return i.houseUnitId === unit.id && isRabApproved_(i.rabBudgetId); }).length > 0;
    var isBaseline = !hasApprovedItems;
    var version = budgets.length + 1;
    var budgetId = uid_('rab');
    var itemsTotal = '0.00';
    var rows = items.map(function (it, idx) {
      var ahsp = Db.find('AhspTemplates', function (a) { return a.code === String(it.ahspCode || '').toUpperCase() && !a.deletedAt; });
      if (!ahsp) throw new AppError(404, 'AHSP_NOT_FOUND', 'AHSP "' + it.ahspCode + '" (baris ' + (idx + 1) + ') tidak ditemukan.');
      var vol = D.qty(V.pos(it.volume, 'Volume baris ' + (idx + 1)));
      var total = D.mul(vol, ahsp.unitPrice);
      itemsTotal = D.add(itemsTotal, total);
      return { id: uid_('rabi'), rabBudgetId: budgetId, projectId: prj.id, houseUnitId: unit.id, wbsCode: V.str(it.wbsCode, 'Kode WBS baris ' + (idx + 1), 20).toUpperCase(), ahspCode: ahsp.code, workDescription: V.str(it.workDescription || ahsp.name, 'Uraian pekerjaan', 200), unit: ahsp.unit, volume: vol, unitPrice: ahsp.unitPrice, totalPrice: total, createdAt: nowIso_() };
    });
    var newTotal = isBaseline ? itemsTotal : D.add(unit.rabRevisedAmount, itemsTotal);
    var docNo = nextDocNo_(tx, 'RAB', unit.unitNumber.replace(/[^A-Z0-9-]/gi, '')) + '-V' + version + (isBaseline ? '-BASE' : '-REV');
    var autoApprove = perm_(actor.role, 'RAB_APPROVE');
    var b = tx.insert('RabBudgets', { id: budgetId, projectId: prj.id, houseUnitId: unit.id, documentNumber: docNo, versionNumber: version, isBaseline: isBaseline, status: autoApprove ? STATUS.APPROVED : STATUS.SUBMITTED, totalAmount: newTotal, revisionReason: reason, createdByUserId: actor.id, approvedByUserId: autoApprove ? actor.id : '', approvedAt: autoApprove ? nowIso_() : '', createdAt: nowIso_() });
    rows.forEach(function (r) { tx.insert('RabItems', r); });
    if (autoApprove) applyRab_(tx, prj, unit, b);
    audit_(tx, actor, { projectId: prj.id, houseUnitId: unit.id, action: autoApprove ? 'RAB_APPROVED' : 'RAB_SUBMITTED', entityType: 'RabBudget', entityId: b.id, sourceReference: docNo, summary: (isBaseline ? 'RAB baseline ' : 'Revisi RAB (CCO) ') + docNo + ' kavling ' + unit.unitNumber + ': ' + rows.length + ' item senilai Rp ' + itemsTotal + (autoApprove ? ' (disetujui).' : ' (menunggu persetujuan).'), after: { budget: b, items: rows } });
    if (!autoApprove) approvalAlert_({ projectId: prj.id, kind: 'RAB', refType: 'RabBudget', refId: b.id, refNo: docNo, link: '#/rab/rab', title: (isBaseline ? 'RAB baseline ' : 'Revisi RAB (CCO) ') + docNo,
      lines: ['Kavling: ' + unit.unitNumber + ' (' + unit.unitType + ')', 'Nilai item: ' + rupiah_(itemsTotal) + ', total RAB menjadi ' + rupiah_(newTotal), 'Alasan: ' + reason, 'Diajukan: ' + actor.fullName] });
    return { budget: b, items: rows };
  });
}

function isRabApproved_(budgetId) {
  var b = Db.byId('RabBudgets', budgetId);
  return !!b && b.status === STATUS.APPROVED;
}

function applyRab_(tx, prj, unit, b) {
  var prevRevised = unit.rabRevisedAmount;
  if (b.isBaseline) unit.rabBaselineAmount = b.totalAmount;
  unit.rabRevisedAmount = b.totalAmount;
  tx.update('HouseUnits', unit);
  prj.revisedBudget = D.add(prj.revisedBudget, D.sub(unit.rabRevisedAmount, prevRevised));
  tx.update('Projects', prj);
}

function decideRab_(actor, p) {
  return mut_(function (tx) {
    var b = Db.byId('RabBudgets', p.rabBudgetId);
    if (!b) throw new AppError(404, 'RAB_NOT_FOUND', 'Dokumen RAB tidak ditemukan.');
    var prj = assertProject_(actor, b.projectId, 'RAB_APPROVE');
    if (b.status !== STATUS.SUBMITTED) throw new AppError(409, 'RAB_ALREADY_DECIDED', 'RAB ini sudah diproses (' + b.status + ').');
    var unit = Db.byId('HouseUnits', b.houseUnitId);
    var approve = p.decision === 'APPROVE';
    b.status = approve ? STATUS.APPROVED : STATUS.REJECTED;
    b.approvedByUserId = actor.id; b.approvedAt = nowIso_();
    if (!approve) b.revisionReason = b.revisionReason + ' [DITOLAK: ' + V.str(p.reason, 'Alasan penolakan', 300) + ']';
    tx.update('RabBudgets', b);
    if (approve) applyRab_(tx, prj, unit, b);
    audit_(tx, actor, { projectId: prj.id, houseUnitId: b.houseUnitId, action: approve ? 'RAB_APPROVED' : 'RAB_REJECTED', entityType: 'RabBudget', entityId: b.id, sourceReference: b.documentNumber, summary: (approve ? 'Persetujuan ' : 'Penolakan ') + 'RAB ' + b.documentNumber + ' oleh ' + actor.fullName + '.', before: { status: STATUS.SUBMITTED }, after: { status: b.status } });
    return b;
  });
}

/** Kuota material proyek = Σ(volume RAB disetujui × koefisien AHSP) vs MR/PO/GI */
function calcQuotas_(projectId) {
  var s = getSettings_();
  var items = Db.where('RabItems', function (i) { return i.projectId === projectId && isRabApproved_(i.rabBudgetId); });
  var ahspByCode = {}; Db.live('AhspTemplates').forEach(function (a) { ahspByCode[a.code] = a; });
  var mrs = Db.where('MaterialRequests', function (m) { return m.projectId === projectId && m.status !== STATUS.REJECTED; });
  var pos = Db.where('PurchaseOrders', function (p) { return p.projectId === projectId && p.status !== STATUS.VOID; });
  var gis = Db.where('StockLedger', function (l) { return l.projectId === projectId && l.movementType === 'PROJECT_ISSUE'; });
  return Db.live('Materials').map(function (mat) {
    var quota = '0.0000';
    items.forEach(function (it) {
      var t = ahspByCode[it.ahspCode]; if (!t || !t.components) return;
      t.components.forEach(function (c) {
        if (c.resourceType === 'MATERIAL' && c.resourceCode === mat.code) quota = D.addQ(quota, D.mulQ(it.volume, c.coefficient));
      });
    });
    var fromRab = !D.isZero(quota);
    if (!fromRab && s.quotaMode === 'ALLOWANCE') quota = D.qty(s.quotaAllowanceQty || '0');
    var req = D.sumQ(mrs.filter(function (m) { return m.materialId === mat.id; }), 'requestedQty');
    var ord = D.sumQ(pos.filter(function (p) { return p.materialId === mat.id; }), 'orderedQty');
    var iss = D.sumQ(gis.filter(function (g) { return g.materialId === mat.id; }), 'quantityOut');
    var rem = D.subQ(quota, req); if (D.isNeg(rem)) rem = '0.0000';
    var util = D.ratioPct(req, quota);
    var status = 'WITHIN_QUOTA';
    if (D.isZero(quota)) status = D.isPos(req) ? 'OVER_QUOTA' : 'NO_QUOTA';
    else if (D.cmp(req, quota) > 0) status = 'OVER_QUOTA';
    else if (D.cmp(util, s.quotaNearLimitPct || '85') >= 0) status = 'NEAR_LIMIT';
    return { materialId: mat.id, materialCode: mat.code, materialName: mat.name, unit: mat.unit, unitPrice: mat.standardPrice, rabQuotaQty: quota, fromRab: fromRab, requestedMrQty: req, remainingQuotaQty: rem, orderedPoQty: ord, issuedGiQty: iss, utilizationPct: util, status: status };
  });
}

/* ----------------------------- WBS ----------------------------- */
function saveWbs_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'WBS_MANAGE');
    var code = V.str(p.wbsCode, 'Kode WBS', 20).toUpperCase();
    var unitId = p.houseUnitId || '';
    if (unitId) { var un = Db.byId('HouseUnits', unitId); if (!un || un.projectId !== prj.id) throw new AppError(404, 'UNIT_NOT_FOUND', 'Kavling tidak ditemukan.'); }
    var dup = Db.find('WbsItems', function (w) { return w.projectId === prj.id && (w.houseUnitId || '') === unitId && w.wbsCode === code && w.id !== p.id; });
    if (dup) throw new AppError(409, 'DUPLICATE_WBS_CODE', 'Kode WBS ' + code + ' sudah ada untuk lingkup ini.');
    var weight = V.pct(p.plannedWeightPct, 'Bobot rencana');
    var others = Db.where('WbsItems', function (w) { return w.projectId === prj.id && (w.houseUnitId || '') === unitId && w.id !== p.id; });
    var totalW = D.add(D.sum(others, 'plannedWeightPct'), weight);
    if (D.cmp(totalW, '100.00') > 0) throw new AppError(400, 'WBS_WEIGHT_OVER_100', 'Total bobot WBS untuk lingkup ini menjadi ' + totalW + '% (maks. 100%).');
    var start = V.date(p.startDate, 'Tanggal mulai'), end = V.date(p.endDate, 'Tanggal selesai');
    if (end < start) throw new AppError(400, 'VALIDATION_ERROR', 'Tanggal selesai harus setelah tanggal mulai.');
    var w = p.id ? Db.byId('WbsItems', p.id) : null;
    var before = w ? JSON.parse(JSON.stringify(w)) : null;
    if (!w) w = tx.insert('WbsItems', { id: uid_('wbs'), projectId: prj.id, actualProgressPct: '0.00', createdAt: nowIso_() });
    w.houseUnitId = unitId; w.wbsCode = code; w.taskName = V.str(p.taskName, 'Nama pekerjaan', 200);
    w.stage = V.str(p.stage, 'Tahap', 40).toUpperCase(); w.plannedWeightPct = weight;
    w.plannedBudget = D.money(V.nonneg(p.plannedBudget, 'Anggaran rencana')); w.startDate = start; w.endDate = end;
    if (p.actualProgressPct !== undefined && p.actualProgressPct !== '') w.actualProgressPct = D.money(D.clamp(V.pct(p.actualProgressPct, 'Progres aktual'), '0', weight));
    tx.update('WbsItems', w);

function mut_(fn) {
  return withLock_(function () {
    var tx = new Db.Tx();
    var r = fn(tx);
    tx.commit();
    return r;
  });
}

function notDup_(table, field, value, exceptId, label, extraPred) {
  var v = String(value).toUpperCase();
  var d = Db.find(table, function (r) {
    return !r.deletedAt && String(r[field]).toUpperCase() === v && r.id !== exceptId && (!extraPred || extraPred(r));
  });
  if (d) throw new AppError(409, 'DUPLICATE', label + ' "' + value + '" sudah terdaftar.');
}

/* ----------------------------- Proyek ----------------------------- */
function saveProject_(actor, p) {
  return mut_(function (tx) {
    var isNew = !p.id;
    if (isNew) { assertPerm_(actor, 'PROJECT_CREATE'); License.assertLimit('projects', Db.live('Projects').length + 1); }
    else assertProject_(actor, p.id, 'UNIT_MANAGE');
    var code = V.str(p.code, 'Kode proyek', 30).toUpperCase();
    notDup_('Projects', 'code', code, p.id, 'Kode proyek');
    var branch = Db.byId('Branches', p.branchId);
    if (!branch || branch.deletedAt) throw new AppError(404, 'BRANCH_NOT_FOUND', 'Cabang tidak ditemukan.');
    var start = V.date(p.startDate, 'Tanggal mulai'), end = V.date(p.targetEndDate, 'Target selesai');
    if (end < start) throw new AppError(400, 'VALIDATION_ERROR', 'Target selesai harus setelah tanggal mulai.');
    var prj = isNew ? null : Db.byId('Projects', p.id);
    var before = prj ? JSON.parse(JSON.stringify(prj)) : null;
    if (isNew) {
      var budget = D.money(V.pos(p.baselineBudget, 'Anggaran baseline'));
      prj = tx.insert('Projects', { id: uid_('prj'), code: code, baselineBudget: budget, revisedBudget: budget, totalUnits: 0, status: 'ACTIVE', createdAt: nowIso_(), deletedAt: '' });
    }
    prj.code = code; prj.branchId = branch.id;
    prj.name = V.str(p.name, 'Nama proyek', 150); prj.location = V.str(p.location, 'Lokasi', 200);
    prj.startDate = start; prj.targetEndDate = end;
    if (p.status) prj.status = V.oneOf(p.status, ['PLANNING', 'ACTIVE', 'ON_HOLD', 'COMPLETED'], 'Status');
    prj.lat = p.lat ? String(p.lat) : (prj.lat || ''); prj.lng = p.lng ? String(p.lng) : (prj.lng || '');
    tx.update('Projects', prj);
    if (isNew) {
      // pembuat & admin otomatis jadi anggota; anggota lain diatur lewat menu Anggota Proyek
      var ids = [actor.id];
      if (p.memberIds && p.memberIds.length) ids = ids.concat(p.memberIds);
      var seen = {};
      ids.forEach(function (uidv) {
        if (seen[uidv]) return; seen[uidv] = 1;
        var u = Db.byId('Users', uidv); if (!u || u.deletedAt) return;
        tx.insert('ProjectMembers', { id: uid_('pm'), projectId: prj.id, userId: u.id, projectRole: u.role, assignedAt: nowIso_() });
      });
    }
    audit_(tx, actor, { projectId: prj.id, action: isNew ? 'PROJECT_CREATED' : 'PROJECT_UPDATED', entityType: 'Project', entityId: prj.id, sourceReference: prj.code, summary: (isNew ? 'Pembuatan proyek ' : 'Pembaruan proyek ') + prj.code + ' - ' + prj.name + '.', before: before, after: prj });
    return prj;
  });
}

function setProjectMembers_(actor, p) {
  assertPerm_(actor, 'ORG_MANAGE');
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId);
    var want = {}; (p.userIds || []).forEach(function (id) { want[id] = 1; });
    var existing = Db.where('ProjectMembers', function (m) { return m.projectId === prj.id; });
    var toRemove = existing.filter(function (m) { return !want[m.userId]; });
    existing.forEach(function (m) { delete want[m.userId]; });
    Object.keys(want).forEach(function (id) {
      var u = Db.byId('Users', id); if (!u || u.deletedAt) return;
      tx.insert('ProjectMembers', { id: uid_('pm'), projectId: prj.id, userId: u.id, projectRole: u.role, assignedAt: nowIso_() });
    });
    tx.commit();
    if (toRemove.length) Db.deleteRows('ProjectMembers', toRemove);
    audit_(tx, actor, { projectId: prj.id, action: 'PROJECT_MEMBERS_UPDATED', entityType: 'Project', entityId: prj.id, sourceReference: prj.code, summary: 'Pembaruan anggota proyek ' + prj.code + ' (' + (p.userIds || []).length + ' orang).', after: { userIds: p.userIds || [] } });
    return { projectId: prj.id, members: (p.userIds || []).length };
  });
}

function saveUser_(actor, p) {
  assertPerm_(actor, 'ORG_MANAGE');
  return mut_(function (tx) {
    var isNew = !p.id;
    var email = V.email(p.email);
    var dup = Db.find('Users', function (r) { return !r.deletedAt && String(r.email).toLowerCase() === email && r.id !== p.id; });
    if (dup) throw new AppError(409, 'DUPLICATE', 'Email sudah dipakai pengguna lain.');
    var role = V.oneOf(p.role, Object.keys(ROLE), 'Peran');
    var u = isNew ? null : Db.byId('Users', p.id);
    var before = u ? safeUser_(u) : null;
    var tempPassword = null;
    if (isNew) {
      License.assertLimit('users', Db.live('Users').filter(function (r) { return r.isActive; }).length + 1);
      tempPassword = p.password ? String(p.password) : ('Hc' + Math.random().toString(36).slice(2, 8) + '9');
      validatePasswordStrength_(tempPassword);
      var salt = Utilities.getUuid();
      u = tx.insert('Users', { id: uid_('usr'), salt: salt, passwordHash: hashPassword_(tempPassword, salt), mustChangePassword: true, failedLogins: 0, lockedUntil: '', lastLoginAt: '', createdAt: nowIso_(), deletedAt: '' });
    }
    if (!isNew && u.id === actor.id && p.isActive === false) throw new AppError(400, 'VALIDATION_ERROR', 'Tidak dapat menonaktifkan akun sendiri.');
    u.email = email; u.fullName = V.str(p.fullName, 'Nama lengkap', 120); u.role = role;
    u.title = V.opt(p.title, 120); u.phone = V.opt(p.phone, 30);
    u.isActive = p.isActive === undefined ? true : !!p.isActive;
    tx.update('Users', u);
    audit_(tx, actor, { action: isNew ? 'USER_CREATED' : 'USER_UPDATED', entityType: 'User', entityId: u.id, sourceReference: u.email, summary: (isNew ? 'Pembuatan' : 'Pembaruan') + ' pengguna ' + u.fullName + ' (' + (ROLE_LABEL[u.role] || u.role) + ').', before: before, after: safeUser_(u) });
    var out = safeUser_(u); if (tempPassword) out.tempPassword = tempPassword;
    return out;
  });
}

function resetUserPassword_(actor, p) {
  assertPerm_(actor, 'ORG_MANAGE');
  return mut_(function (tx) {
    var u = Db.byId('Users', p.userId);
    if (!u || u.deletedAt) throw new AppError(404, 'USER_NOT_FOUND', 'Pengguna tidak ditemukan.');
    var pw = 'Hc' + Math.random().toString(36).slice(2, 8) + '7';

    return { userId: u.id, tempPassword: pw };
  });
}

/** Soft delete master data (transaksi yang sudah dibukukan tidak dapat dihapus) */
function softDelete_(actor, p) {
  var immutable = ['StockLedger', 'PurchaseOrders', 'GoodsReceipts', 'WorkOpnames', 'Invoices', 'Payments', 'AuditLogs', 'PayrollEntries', 'DailyReports'];
  if (immutable.indexOf(p.entityType) >= 0) {
    throw new AppError(409, 'IMMUTABLE_TRANSACTION_PROTECTED', 'Transaksi ' + p.entityType + ' yang sudah dibukukan bersifat permanen. Gunakan dokumen koreksi/penyesuaian.');
  }
  var allowed = { Materials: 'MASTER_MANAGE', Vendors: 'MASTER_MANAGE', Subcontractors: 'MASTER_MANAGE', AhspTemplates: 'MASTER_MANAGE', Warehouses: 'ORG_MANAGE', Branches: 'ORG_MANAGE', Users: 'ORG_MANAGE', FloorPlans: 'DESIGN_MANAGE', Brochures: 'MARKETING_MANAGE' };
  if (!allowed[p.entityType]) throw new AppError(400, 'UNSUPPORTED_ENTITY_DELETE', 'Tipe data ini tidak mendukung penghapusan.');
  assertPerm_(actor, allowed[p.entityType]);
  return mut_(function (tx) {
    var r = Db.byId(p.entityType, p.id);
    if (!r || r.deletedAt) throw new AppError(404, 'NOT_FOUND', 'Data tidak ditemukan.');
    if (p.entityType === 'Users' && r.id === actor.id) throw new AppError(400, 'VALIDATION_ERROR', 'Tidak dapat menghapus akun sendiri.');
    if (p.entityType === 'Materials') {
      var bal = Db.all('Warehouses').some(function (w) { return D.isPos(stockState_(w.id, r.id).qty); });
      if (bal) throw new AppError(409, 'MATERIAL_HAS_STOCK', 'Material masih memiliki saldo stok di gudang. Kosongkan stok terlebih dahulu.');
    }
    r.deletedAt = nowIso_();
    if (p.entityType === 'Users') r.isActive = false;
    tx.update(p.entityType, r);
    audit_(tx, actor, { action: 'MASTER_SOFT_DELETED', entityType: p.entityType, entityId: r.id, sourceReference: r.code || r.email || r.id, summary: 'Penghapusan (soft delete) ' + p.entityType + ' ' + (r.code || r.email || r.name || r.id) + '.', before: { deletedAt: '' }, after: { deletedAt: r.deletedAt } });
    return { deleted: true };
  });
}

function saveSettings_(actor, p) {
  assertPerm_(actor, 'COMPANY_MANAGE');
  var r = mut_(function (tx) {
    var editable = ['companyName', 'companyCode', 'companyAddress', 'companyTaxId', 'companyPhone', 'ppnPercent', 'overtimeRatePct',
      'qcPassScore', 'quotaNearLimitPct', 'quotaMode', 'quotaAllowanceQty', 'defaultWarrantyMonths', 'bastMinProgress',
      'fonnteToken', 'notifyPhones', 'licenseServerUrl', 'dailyBackup', 'keepWarm', 'privacyContact', 'companyEmail',
      'appUrl', 'waProvider', 'waWebhookUrl', 'emailNotify', 'customerReminders', 'reminderDaysBefore', 'reminderDaysAfter', 'reminderHour', 'reminderTemplate',
      'bankName', 'bankAccountNo', 'bankAccountName', 'directorPhones', 'directorEmails', 'approvalAlert', 'approvalAlertMinAmount',
      'mapTileUrl', 'mapAttribution', 'mapShowBuyer'];
    var oldHour = getSettings_().reminderHour;
    var changed = {};
    editable.forEach(function (k) {
      if (p[k] === undefined) return;
      var v = String(p[k]).trim();
      if ((k === 'fonnteToken') && v.indexOf('••••') === 0) return; // nilai tersamar tidak diubah
      if (['ppnPercent', 'overtimeRatePct', 'qcPassScore', 'quotaNearLimitPct', 'bastMinProgress'].indexOf(k) >= 0) v = V.pct(v, k);
      if (k === 'companyCode') v = V.str(v, 'Kode perusahaan', 8).toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (k === 'quotaMode') v = V.oneOf(v, ['STRICT', 'ALLOWANCE'], 'Mode kuota');
      if (k === 'keepWarm') v = V.oneOf(v, ['ON', 'OFF', 'ALWAYS'], 'Pemanas server');
      if (k === 'companyEmail' && v) v = V.email(v);
      if (k === 'waProvider') v = V.oneOf(v, ['FONNTE', 'WEBHOOK', 'OFF'], 'Penyedia WhatsApp');
      if (['emailNotify', 'customerReminders', 'approvalAlert'].indexOf(k) >= 0) v = V.oneOf(v, ['ON', 'OFF'], k);
      if (k === 'reminderHour') { var hh = parseInt(v, 10); if (isNaN(hh) || hh < 0 || hh > 23) throw new AppError(400, 'VALIDATION_ERROR', 'Jam pengingat harus 0–23.'); v = String(hh); }
      if (k === 'reminderDaysBefore' || k === 'reminderDaysAfter') { v = v.split(/[,\s]+/).map(function (x) { return parseInt(x, 10); }).filter(function (x) { return !isNaN(x) && x >= 0 && x <= 90; }).join(','); }
      if ((k === 'appUrl' || k === 'waWebhookUrl') && v && !/^https:\/\/[^\s]+$/i.test(v)) throw new AppError(400, 'VALIDATION_ERROR', 'Alamat ' + (k === 'appUrl' ? 'aplikasi' : 'webhook') + ' harus diawali https://');
      if (k === 'approvalAlertMinAmount') v = V.nonneg(v, 'Batas nominal peringatan');
      if (k === 'mapTileUrl' && v && !/^https:\/\/.+\{z\}.+\{x\}.+\{y\}|^https:\/\/.+\{z\}.+\{y\}.+\{x\}/.test(v)) throw new AppError(400, 'VALIDATION_ERROR', 'URL tile peta harus https dan memuat {z}, {x}, {y}.');
      if (k === 'mapShowBuyer') v = V.oneOf(v, ['ROLE', 'HIDE'], 'Tampilkan pembeli di peta');
      if (k === 'directorEmails' && v) v = v.split(',').map(function (x) { return V.email(x); }).join(',');
      if (k === 'reminderTemplate') { if (v.length > 1500) throw new AppError(400, 'VALIDATION_ERROR', 'Templat pengingat maksimal 1.500 karakter.'); if (v === REMINDER_TEMPLATE_DEFAULT) v = ''; }
      setSetting_(tx, k, v); changed[k] = (k === 'fonnteToken' ? '(diubah)' : v);
    });
    audit_(tx, actor, { action: 'SETTINGS_UPDATED', entityType: 'Settings', entityId: 'settings', sourceReference: 'Settings', summary: 'Pembaruan pengaturan: ' + Object.keys(changed).join(', '), after: changed });
    return { saved: Object.keys(changed), hourChanged: changed.reminderHour !== undefined && changed.reminderHour !== oldHour ? changed.reminderHour : null };
  });
  if (r.hourChanged !== null) installTriggers_({ reminderHour: r.hourChanged, force: true });
  return r;
}

/**

function savePhoto_(base64, name) {
  if (!base64) return null;
  var m = String(base64).match(/^data:(image\/[a-z]+);base64,(.+)$/i);
  if (!m) throw new AppError(400, 'VALIDATION_ERROR', 'Format foto tidak valid.');
  if (m[2].length > 8 * 1024 * 1024) throw new AppError(400, 'PHOTO_TOO_LARGE', 'Foto terlalu besar (maks ±6 MB).');
  var folder = getOrCreateFolder_(APP.PHOTO_FOLDER);
  var blob = Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], name + '.' + (m[1].split('/')[1] || 'jpg'));
  var file = folder.createFile(blob);
  try { file.setSharing(DriveApp.Access.DOMAIN_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) {
    try { file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW); } catch (e2) { }
  }
  return { id: file.getId(), url: 'https://drive.google.com/thumbnail?id=' + file.getId() + '&sz=w1200' };
}
function getOrCreateFolder_(name) {
  var key = 'FOLDER_' + name;
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty(key);
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) { } }
  var it = DriveApp.getFoldersByName(name);
  var f = it.hasNext() ? it.next() : DriveApp.createFolder(name);
  props.setProperty(key, f.getId());
  return f;
}

/* ----------------------------- Laporan Harian ----------------------------- */
function createDsr_(actor, p) {
  // foto disimpan dulu di luar lock (operasi Drive lambat)
  var photo = null;
  if (p.photoBase64) photo = savePhoto_(p.photoBase64, 'DSR-' + (p.houseUnitId || 'x') + '-' + Date.now());
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'DAILY_REPORT_SUBMIT');
    var unit = unitOf_(prj, p.houseUnitId, true);
    if (unit.status === 'HANDED_OVER') throw new AppError(409, 'UNIT_HANDED_OVER', 'Kavling sudah serah terima; gunakan klaim garansi untuk pekerjaan perbaikan.');
    var add = V.pct(p.progressAddedPct, 'Tambahan progres');
    var summary = V.str(p.workSummary, 'Ringkasan pekerjaan', 2000);
    var weathers = ['CERAH', 'BERAWAN', 'HUJAN_RINGAN', 'HUJAN_LEBAT'];
    var prev = unit.progressPercent, prevStatus = unit.status;
    var cum = D.money(D.clamp(D.add(prev, add), '0', '100'));
    unit.progressPercent = cum;
    if (unit.status !== 'HANDOVER_READY') {
      if (D.cmp(cum, '90') >= 0) unit.status = 'QC_INSPECTION';
      else if (D.cmp(cum, '70') >= 0) unit.status = 'FINISHING';
      else if (D.cmp(cum, '35') >= 0) unit.status = 'STRUCTURE';
      else if (D.isPos(cum)) unit.status = 'FOUNDATION';
    }
    tx.update('HouseUnits', unit);
    var wbsCode = V.opt(p.wbsCode, 20).toUpperCase();
    if (wbsCode) {
      var w = Db.find('WbsItems', function (x) { return x.projectId === prj.id && x.wbsCode === wbsCode && (!x.houseUnitId || x.houseUnitId === unit.id); });
      if (w) {
        // progres WBS diinput sebagai % bobot proyek yang dicapai hari ini; dibatasi bobot rencana
        var wAdd = p.wbsProgressAddedPct !== undefined && p.wbsProgressAddedPct !== '' ? V.pct(p.wbsProgressAddedPct, 'Tambahan progres WBS') : add;
        w.actualProgressPct = D.money(D.clamp(D.add(w.actualProgressPct, wAdd), '0', w.plannedWeightPct));
        tx.update('WbsItems', w);
      }
    }
    var lat = p.lat ? String(p.lat) : '', lng = p.lng ? String(p.lng) : '';
    var r = tx.insert('DailyReports', {
      id: uid_('dsr'), projectId: prj.id, houseUnitId: unit.id, wbsCode: wbsCode, reportNumber: nextDocNo_(tx, 'DSR'),
      reportDate: p.reportDate ? V.date(p.reportDate, 'Tanggal laporan') : today_(),
      weatherMorning: weathers.indexOf(p.weatherMorning) >= 0 ? p.weatherMorning : 'CERAH',
      weatherAfternoon: weathers.indexOf(p.weatherAfternoon) >= 0 ? p.weatherAfternoon : 'CERAH',
      workforceCount: Math.max(0, parseInt(p.workforceCount, 10) || 0), progressAddedPct: add, cumulativeProgressPct: cum,
      workSummary: summary, issues: V.opt(p.issues, 1000), photoFileId: photo ? photo.id : '', photoUrl: photo ? photo.url : '',
      lat: lat, lng: lng, reportedByUserId: actor.id, status: STATUS.APPROVED, createdAt: nowIso_()
    });
    audit_(tx, actor, { projectId: prj.id, houseUnitId: unit.id, action: 'DAILY_SITE_REPORT_LOGGED', entityType: 'DailyReport', entityId: r.id, sourceReference: r.reportNumber + (wbsCode ? ' (' + wbsCode + ')' : ''), summary: 'Laporan harian ' + r.reportNumber + ' kavling ' + unit.unitNumber + ': +' + add + '% (kumulatif ' + cum + '%, ' + unit.status + ')' + (lat ? ' @' + lat + ',' + lng : '') + '.', before: { progressPercent: prev, status: prevStatus }, after: { progressPercent: cum, status: unit.status } });
    return r;
  });
}
