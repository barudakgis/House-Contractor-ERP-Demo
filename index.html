/** Payroll per periode: riwayat tersimpan (tidak menimpa periode sebelumnya), dibebankan ke kavling */
function createPayroll_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'PAYROLL_MANAGE');
    var w = Db.byId('Workers', p.workerId);
    if (!w || w.projectId !== prj.id) throw new AppError(404, 'WORKER_NOT_FOUND', 'Pekerja tidak ditemukan pada proyek ini.');
    var unit = unitOf_(prj, p.houseUnitId, false);
    var start = V.date(p.periodStart, 'Awal periode'), end = V.date(p.periodEnd, 'Akhir periode');
    if (end < start) throw new AppError(400, 'VALIDATION_ERROR', 'Akhir periode harus setelah awal periode.');
    if (p.fromAttendance) {
      var att = attendanceSummary_(prj.id, w.id, start, end);
      p.daysPresent = att.days; if (p.overtimeHours === undefined || p.overtimeHours === '') p.overtimeHours = att.overtime;
    }
    var days = D.money(V.nonneg(p.daysPresent, 'Hari hadir'));
    var spanDays = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
    if (D.cmp(days, String(spanDays)) > 0) throw new AppError(400, 'VALIDATION_ERROR', 'Hari hadir (' + days + ') melebihi panjang periode (' + spanDays + ' hari).');
    var ot = D.money(V.nonneg(p.overtimeHours, 'Jam lembur'));
    var overlap = Db.find('PayrollEntries', function (e) { return e.workerId === w.id && e.status !== STATUS.VOID && !(e.periodEnd < start || e.periodStart > end) && (e.houseUnitId || '') === (unit ? unit.id : ''); });
    if (overlap) throw new AppError(409, 'PAYROLL_PERIOD_OVERLAP', 'Periode tumpang tindih dengan payroll ' + overlap.payrollNumber + ' (' + overlap.periodStart + ' s/d ' + overlap.periodEnd + ').');
    var rate = p.dailyRate ? D.money(V.pos(p.dailyRate, 'Upah harian')) : w.dailyRate;
    var s = getSettings_();
    var base = D.mul(days, rate);
    var otPay = D.mul(ot, D.pct(rate, s.overtimeRatePct || '15'));
    var e = tx.insert('PayrollEntries', {
      id: uid_('pay'), projectId: prj.id, houseUnitId: unit ? unit.id : '', wbsCode: V.opt(p.wbsCode, 20).toUpperCase(), workerId: w.id,
      workerCode: w.workerCode, workerName: w.fullName, skillRole: w.skillRole, periodLabel: V.opt(p.periodLabel, 80) || (start + ' s/d ' + end),
      periodStart: start, periodEnd: end, daysPresent: days, overtimeHours: ot, dailyRate: rate, basePay: base, overtimePay: otPay,
      totalPay: D.add(base, otPay), payrollNumber: nextDocNo_(tx, 'PYR'), status: STATUS.POSTED, createdByUserId: actor.id, createdAt: nowIso_()
    });
    audit_(tx, actor, { projectId: prj.id, houseUnitId: e.houseUnitId, action: 'WORKFORCE_PAYROLL_RECORDED', entityType: 'PayrollEntry', entityId: e.id, sourceReference: e.payrollNumber + ' / ' + w.workerCode, summary: 'Payroll ' + e.payrollNumber + ' ' + w.fullName + ' (' + e.periodLabel + '): ' + days + ' hari + ' + ot + ' jam lembur = Rp ' + e.totalPay + (unit ? ' → kavling ' + unit.unitNumber : ' → overhead proyek') + '.', after: e });
    return e;
  });
}

/* ----------------------------- Opname ----------------------------- */
function createOpname_(actor, p) {
  return mut_(function (tx) {
    var c = Db.byId('SubconContracts', p.contractId);
    if (!c) throw new AppError(404, 'CONTRACT_NOT_FOUND', 'SPK tidak ditemukan.');
    var prj = assertProject_(actor, c.projectId, 'OPNAME_SUBMIT');
    if (c.status !== STATUS.APPROVED) throw new AppError(400, 'CONTRACT_NOT_APPROVED', 'SPK belum disetujui.');
    var unitId = c.houseUnitId || p.houseUnitId;
    var unit = unitOf_(prj, unitId, true);
    var cur = V.pct(p.currentProgressPct, 'Progres kumulatif');
    var prevOps = Db.where('WorkOpnames', function (o) { return o.contractId === c.id && o.status !== STATUS.REJECTED; });
    var prev = '0.00';
    prevOps.forEach(function (o) { if (D.cmp(o.currentProgressPct, prev) > 0) prev = o.currentProgressPct; });
    if (prevOps.some(function (o) { return o.status === STATUS.SUBMITTED; })) throw new AppError(409, 'OPNAME_PENDING', 'Masih ada opname SPK ini yang menunggu persetujuan.');
    if (D.cmp(cur, prev) <= 0) throw new AppError(400, 'INVALID_OPNAME_PROGRESS', 'Progres kumulatif (' + cur + '%) harus lebih besar dari opname sebelumnya (' + prev + '%).');
    var delta = D.sub(cur, prev);
    var gross = D.pct(c.contractValue, delta);
    var ret = D.pct(gross, c.retentionPercent);
    var autoApprove = perm_(actor.role, 'OPNAME_APPROVE');
    var o = tx.insert('WorkOpnames', {
      id: uid_('opn'), projectId: c.projectId, houseUnitId: unit.id, opnameNumber: nextDocNo_(tx, 'OPN'), contractId: c.id,
      contractNumber: c.contractNumber, subcontractorName: c.subcontractorName, wbsCode: c.wbsCode, dailyReportId: V.opt(p.dailyReportId, 40),
      previousProgressPct: prev, currentProgressPct: cur, opnameDeltaPct: delta, grossEarnedAmount: gross, retentionAmount: ret,
      netPayableAmount: D.sub(gross, ret), verifiedByUserId: actor.id, approvedByUserId: autoApprove ? actor.id : '', invoiceId: '',
      status: autoApprove ? STATUS.APPROVED : STATUS.SUBMITTED, createdAt: nowIso_()
    });
    if (autoApprove) applyOpname_(tx, c, o);
    audit_(tx, actor, { projectId: c.projectId, houseUnitId: unit.id, action: autoApprove ? 'WORK_OPNAME_APPROVED' : 'WORK_OPNAME_SUBMITTED', entityType: 'WorkOpname', entityId: o.id, sourceReference: c.contractNumber + ' -> ' + o.opnameNumber, summary: 'Opname ' + o.opnameNumber + ' (' + c.subcontractorName + '): ' + prev + '% → ' + cur + '%, bruto Rp ' + gross + ', retensi Rp ' + ret + ', netto Rp ' + o.netPayableAmount + '.', after: o });
    if (!autoApprove) approvalAlert_({ projectId: c.projectId, kind: 'OPNAME', refType: 'WorkOpname', refId: o.id, refNo: o.opnameNumber, link: '#/field/spk', title: 'Opname subkon ' + o.opnameNumber,
      lines: ['SPK: ' + c.contractNumber + ' — ' + c.subcontractorName, 'Kavling: ' + unit.unitNumber + ', progres ' + prev + '% → ' + cur + '%', 'Tagihan netto: ' + rupiah_(o.netPayableAmount), 'Diverifikasi: ' + actor.fullName] });
    return o;
  });
}
function applyOpname_(tx, c, o) {
  c.billedToDate = D.add(c.billedToDate, o.grossEarnedAmount);
  c.progressToDate = o.currentProgressPct;
  c.retentionHeld = D.add(c.retentionHeld, o.retentionAmount);
  tx.update('SubconContracts', c);
}
function approveOpname_(actor, p) {
  return mut_(function (tx) {

/** Pelepasan retensi subkon (setelah masa pemeliharaan) */
function releaseRetention_(actor, p) {
  return mut_(function (tx) {
    var c = Db.byId('SubconContracts', p.contractId);
    if (!c) throw new AppError(404, 'CONTRACT_NOT_FOUND', 'SPK tidak ditemukan.');
    assertProject_(actor, c.projectId, 'FINANCE_PAYMENT_POST');
    var avail = D.sub(c.retentionHeld, c.retentionReleased);
    if (!D.isPos(avail)) throw new AppError(400, 'NO_RETENTION', 'Tidak ada retensi tertahan untuk dilepas.');
    var unit = c.houseUnitId ? Db.byId('HouseUnits', c.houseUnitId) : null;
    if (unit && unit.warrantyEndDate && unit.warrantyEndDate > today_() && !p.force) {
      throw new AppError(400, 'WARRANTY_NOT_ENDED', 'Masa pemeliharaan kavling ' + unit.unitNumber + ' berakhir ' + unit.warrantyEndDate + '. Centang "lepas lebih awal" bila disetujui manajemen.');
    }
    var amt = p.amount ? D.money(V.pos(p.amount, 'Nominal')) : avail;
    if (D.cmp(amt, avail) > 0) throw new AppError(400, 'VALIDATION_ERROR', 'Nominal melebihi retensi tertahan (Rp ' + avail + ').');
    var inv = tx.insert('Invoices', {
      id: uid_('inv'), projectId: c.projectId, houseUnitId: c.houseUnitId, invoiceNumber: nextDocNo_(tx, 'INV-RET'), invoiceType: 'AP_RETENTION',
      sourceDocType: 'SUBCON_CONTRACT', sourceDocNumber: c.contractNumber, sourceDocId: c.id, counterpartyName: c.subcontractorName,
      grossAmount: amt, taxAmount: '0.00', retentionAmount: '0.00', netAmount: amt, paidAmount: amt, status: STATUS.PAID,
      invoiceDate: today_(), dueDate: today_(), notes: 'Pelepasan retensi', createdByUserId: actor.id, createdAt: nowIso_()
    });
    var pay = tx.insert('Payments', {
      id: uid_('pmt'), projectId: c.projectId, houseUnitId: c.houseUnitId, paymentNumber: nextDocNo_(tx, 'PAY-OUT'), invoiceId: inv.id,
      invoiceNumber: inv.invoiceNumber, sourceDocNumber: c.contractNumber, paymentDirection: 'OUTFLOW_AP', paymentMethod: 'BANK_TRANSFER',
      bankReference: V.str(p.bankReference, 'Referensi bank', 80), amount: amt, paidByUserId: actor.id, paidAt: nowIso_(), reconciled: false, reconciledAt: '', reconciledByUserId: ''
    });
    c.retentionReleased = D.add(c.retentionReleased, amt); tx.update('SubconContracts', c);
    audit_(tx, actor, { projectId: c.projectId, houseUnitId: c.houseUnitId, action: 'SUBCON_RETENTION_RELEASED', entityType: 'SubconContract', entityId: c.id, sourceReference: c.contractNumber + ' -> ' + pay.paymentNumber, summary: 'Pelepasan retensi ' + c.contractNumber + ' (' + c.subcontractorName + ') Rp ' + amt + '.', after: { retentionReleased: c.retentionReleased } });
    return { contract: c, invoice: inv, payment: pay };
  });
}

/* ----------------------------- Presensi tukang (Mode Lapangan) ----------------------------- */
var ATT_STATUS = { HADIR: '1', SETENGAH: '0.5', IZIN: '0', SAKIT: '0', ALPA: '0' };
/**
 * Simpan presensi harian banyak pekerja sekaligus (dapat dikirim dari antrean offline).
 * Satu pekerja hanya punya satu catatan per tanggal — pengiriman ulang memperbarui catatan yang sama.
 */
function saveAttendance_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'ATTENDANCE_RECORD');
    var date = V.date(p.workDate, 'Tanggal presensi');
    if (date > today_()) throw new AppError(400, 'VALIDATION_ERROR', 'Presensi tidak boleh untuk tanggal yang akan datang.');
    if (daysBetween_(date, today_()) > 31 && !perm_(actor.role, 'PAYROLL_MANAGE')) throw new AppError(400, 'VALIDATION_ERROR', 'Presensi lebih dari 31 hari lalu hanya dapat diubah Site Engineer/PM.');
    var entries = p.entries || [];
    if (!entries.length) throw new AppError(400, 'VALIDATION_ERROR', 'Tidak ada pekerja yang dicatat.');
    var defUnit = p.houseUnitId ? unitOf_(prj, p.houseUnitId, false) : null;
    var existing = {}; Db.where('Attendance', function (a) { return a.projectId === prj.id && a.workDate === date; }).forEach(function (a) { existing[a.workerId] = a; });
    var n = { HADIR: 0, SETENGAH: 0, IZIN: 0, SAKIT: 0, ALPA: 0 }, ot = '0';
    entries.forEach(function (e) {
      var w = Db.byId('Workers', e.workerId);
      if (!w || w.projectId !== prj.id) throw new AppError(404, 'WORKER_NOT_FOUND', 'Pekerja tidak ditemukan pada proyek ini.');
      var st = V.oneOf(e.status, Object.keys(ATT_STATUS), 'Status presensi ' + w.fullName);
      var unit = e.houseUnitId ? unitOf_(prj, e.houseUnitId, false) : defUnit;
      var hours = st === 'HADIR' || st === 'SETENGAH' ? D.money(V.nonneg(e.overtimeHours, 'Jam lembur')) : '0.00';
      if (D.cmp(hours, '8') > 0) throw new AppError(400, 'VALIDATION_ERROR', 'Lembur ' + w.fullName + ' maksimal 8 jam per hari.');
      var a = existing[w.id];
      if (!a) a = tx.insert('Attendance', { id: uid_('att'), projectId: prj.id, workDate: date, workerId: w.id, createdAt: nowIso_() });
      a.workerCode = w.workerCode; a.workerName = w.fullName; a.houseUnitId = unit ? unit.id : ''; a.status = st; a.dayValue = ATT_STATUS[st];
      a.overtimeHours = hours; a.notes = V.opt(e.notes, 200); a.lat = p.lat ? String(p.lat) : ''; a.lng = p.lng ? String(p.lng) : '';
      a.recordedByUserId = actor.id; a.updatedAt = nowIso_();
      tx.update('Attendance', a);
      n[st]++; ot = D.add(ot, hours);
    });
    audit_(tx, actor, { projectId: prj.id, houseUnitId: defUnit ? defUnit.id : '', action: 'ATTENDANCE_RECORDED', entityType: 'Attendance', entityId: date, sourceReference: 'PRESENSI ' + date, summary: 'Presensi ' + date + ': ' + n.HADIR + ' hadir, ' + n.SETENGAH + ' setengah hari, ' + (n.IZIN + n.SAKIT) + ' izin/sakit, ' + n.ALPA + ' alpa; lembur ' + ot + ' jam' + (p.lat ? ' @' + p.lat + ',' + p.lng : '') + '.' });
    return { workDate: date, counts: n, overtimeHours: ot, total: entries.length };
  });
}
/** Ringkasan presensi pekerja dalam periode (dipakai payroll) */
function attendanceSummary_(projectId, workerId, start, end) {
  var days = '0', ot = '0', count = 0;
  Db.where('Attendance', function (a) { return a.projectId === projectId && a.workerId === workerId && a.workDate >= start && a.workDate <= end; }).forEach(function (a) { days = D.add(days, a.dayValue); ot = D.add(ot, a.overtimeHours); count++; });
  return { days: D.money(days), overtime: D.money(ot), records: count };
}

/* ---- SvcFinance.gs ---- */
/**
 * SvcFinance.gs — Faktur AP/AR (3-way match PO–GRN–Invoice), pembayaran parsial, rekonsiliasi bank, umur hutang/piutang.
 * Tipe faktur: AP_VENDOR (dari PO), AP_OTHER (biaya langsung lain: sewa alat, dsb), AR_PROGRESS_BILLING (tagihan konsumen/KPR).
 */

function createInvoice_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'FINANCE_INVOICE_CREATE');
    var type = V.oneOf(p.invoiceType, ['AP_VENDOR', 'AP_OTHER', 'AR_PROGRESS_BILLING'], 'Jenis faktur');
    var unit = unitOf_(prj, p.houseUnitId, type === 'AR_PROGRESS_BILLING');
    var s = getSettings_();
    var gross = D.money(V.pos(p.grossAmount, 'Nilai bruto (DPP)'));
    var taxPct = (p.taxPercent === undefined || p.taxPercent === '') ? (type === 'AP_VENDOR' ? s.ppnPercent : '0') : V.pct(p.taxPercent, 'Pajak');
    var retPct = V.pct(p.retentionPercent || '0', 'Retensi');
    var tax = D.pct(gross, taxPct), ret = D.pct(gross, retPct);
    var net = D.sub(D.add(gross, tax), ret);
    var src = { type: 'MANUAL', no: V.opt(p.sourceDocNumber, 80), id: '' };
    var counterparty = V.opt(p.counterpartyName, 150);
    var dueDays = 30;
    var po = null;
    if (type === 'AP_VENDOR') {
      po = Db.byId('PurchaseOrders', p.purchaseOrderId);
      if (!po || po.projectId !== prj.id) throw new AppError(400, 'PO_REQUIRED', 'Faktur vendor wajib merujuk PO proyek ini (3-way match).');
      var receivedValue = D.mul(po.receivedQty, po.unitPrice);
      var receivedGross = receivedValue;
      var invoicedGross = D.sum(Db.where('Invoices', function (i) { return i.sourceDocId === po.id && i.status !== STATUS.VOID; }), 'grossAmount');
      if (D.cmp(D.add(invoicedGross, gross), receivedGross) > 0) {
        throw new AppError(400, 'THREE_WAY_MATCH_FAILED', '3-way match gagal: total tagihan (Rp ' + D.add(invoicedGross, gross) + ') melebihi nilai barang yang sudah diterima GRN (Rp ' + receivedGross + ').');
      }
      src = { type: 'PO_GRN', no: po.poNumber, id: po.id };
      counterparty = po.vendorName;
      var v = Db.byId('Vendors', po.vendorId); if (v) dueDays = Number(v.paymentTermDays) || 30;
      if (!unit && po.houseUnitId) unit = Db.byId('HouseUnits', po.houseUnitId);
    } else if (type === 'AR_PROGRESS_BILLING') {
      counterparty = counterparty || unit.buyerName || 'Konsumen';
      src = { type: 'CUSTOMER_BILLING', no: src.no || ('Termin ' + unit.unitNumber), id: unit.id };
      dueDays = 14;
    } else {
      if (!counterparty) throw new AppError(400, 'VALIDATION_ERROR', 'Nama pihak/penyedia wajib diisi.');
      src.type = 'OTHER_COST';
    }
    var invDate = p.invoiceDate ? V.date(p.invoiceDate, 'Tanggal faktur') : today_();
    var due = p.dueDate ? V.date(p.dueDate, 'Jatuh tempo') : addDays_(invDate, dueDays);
    var inv = tx.insert('Invoices', {
      id: uid_('inv'), projectId: prj.id, houseUnitId: unit ? unit.id : '', invoiceNumber: nextDocNo_(tx, type === 'AR_PROGRESS_BILLING' ? 'INV-AR' : 'INV-AP'),
      invoiceType: type, sourceDocType: src.type, sourceDocNumber: src.no, sourceDocId: src.id, counterpartyName: counterparty,
      grossAmount: gross, taxAmount: tax, retentionAmount: ret, netAmount: net, paidAmount: '0.00', status: STATUS.POSTED,
      invoiceDate: invDate, dueDate: due, notes: V.opt(p.notes, 500), createdByUserId: actor.id, createdAt: nowIso_(),
      billTo: type === 'AR_PROGRESS_BILLING' && p.billTo === 'BANK' ? 'BANK' : (type === 'AR_PROGRESS_BILLING' ? 'BUYER' : ''), lastReminderAt: '', reminderCount: 0
    });
    if (type === 'AR_PROGRESS_BILLING' && inv.billTo === 'BUYER' && p.notifyCustomer && unit) {
      var s2 = getSettings_();
      unitRecipients_(unit).forEach(function (r) {
        var t = 'Yth. ' + r.name + ',\nTagihan ' + (inv.sourceDocNumber || 'termin') + ' untuk rumah ' + unit.unitNumber + ' telah terbit.\nNomor: ' + inv.invoiceNumber + '\nNominal: ' + rupiah_(net) + '\nJatuh tempo: ' + tglIndo_(due) + '\nPembayaran ke: ' + bankLine_(s2) + '\n' + (portalLink_(s2) ? '\nDetail: ' + portalLink_(s2) + '\n' : '') + '\n' + (s2.companyName || '');
        var meta = { kind: 'INVOICE_ISSUED', name: r.name, projectId: prj.id, refType: 'Invoice', refId: inv.id, refNo: inv.invoiceNumber };
        if (r.phone) Notify.wa(r.phone, t, meta); if (r.email) Notify.email(r.email, 'Tagihan ' + inv.invoiceNumber, t, meta);
      });
    }
    if (po) { po.invoicedAmount = D.add(po.invoicedAmount, D.add(gross, tax)); tx.update('PurchaseOrders', po); }
    audit_(tx, actor, { projectId: prj.id, houseUnitId: inv.houseUnitId, action: 'FINANCE_INVOICE_POSTED', entityType: 'Invoice', entityId: inv.id, sourceReference: (src.no || '-') + ' -> ' + inv.invoiceNumber, summary: 'Faktur ' + inv.invoiceNumber + ' (' + type + ', ' + counterparty + ') netto Rp ' + net + ', jatuh tempo ' + due + '.', after: inv });
    var result = { invoice: inv, payment: null };
    if (p.payNow) {
      assertPerm_(actor, 'FINANCE_PAYMENT_POST');
      result.payment = postPayment_(tx, actor, inv, { amount: net, paymentMethod: p.paymentMethod, bankReference: p.bankReference });
    }
    return result;
  });
}

function postPayment_(tx, actor, inv, p) {
  var remaining = D.sub(inv.netAmount, inv.paidAmount);
  if (!D.isPos(remaining)) throw new AppError(400, 'INVOICE_ALREADY_PAID', 'Faktur ' + inv.invoiceNumber + ' sudah lunas.');
  var amt = p.amount ? D.money(V.pos(p.amount, 'Nominal bayar')) : remaining;
  if (D.cmp(amt, remaining) > 0) throw new AppError(400, 'PAYMENT_EXCEEDS_INVOICE_BALANCE', 'Nominal (Rp ' + amt + ') melebihi sisa tagihan (Rp ' + remaining + ').');
  var dir = inv.invoiceType === 'AR_PROGRESS_BILLING' ? 'INFLOW_AR' : 'OUTFLOW_AP';
  var pay = tx.insert('Payments', {
    id: uid_('pmt'), projectId: inv.projectId, houseUnitId: inv.houseUnitId, paymentNumber: nextDocNo_(tx, dir === 'INFLOW_AR' ? 'PAY-IN' : 'PAY-OUT'),
    invoiceId: inv.id, invoiceNumber: inv.invoiceNumber, sourceDocNumber: inv.sourceDocNumber, paymentDirection: dir,
    paymentMethod: V.oneOf(p.paymentMethod || 'BANK_TRANSFER', ['BANK_TRANSFER', 'GIRO', 'CASH', 'ESCROW_KPR'], 'Metode bayar'),
    bankReference: V.str(p.bankReference, 'Referensi bank / no. bukti', 80), amount: amt, paidByUserId: actor.id, paidAt: nowIso_(),
    reconciled: false, reconciledAt: '', reconciledByUserId: ''
  });
  var prevPaid = inv.paidAmount;
  inv.paidAmount = D.add(inv.paidAmount, amt);
  inv.status = D.cmp(inv.paidAmount, inv.netAmount) >= 0 ? STATUS.PAID : STATUS.PARTIAL;
  tx.update('Invoices', inv);
  audit_(tx, actor, { projectId: inv.projectId, houseUnitId: inv.houseUnitId, action: 'FINANCE_PAYMENT_POSTED', entityType: 'Payment', entityId: pay.id, sourceReference: inv.invoiceNumber + ' -> ' + pay.paymentNumber, summary: (dir === 'INFLOW_AR' ? 'Penerimaan' : 'Pembayaran') + ' Rp ' + amt + ' untuk ' + inv.invoiceNumber + ' (' + inv.counterpartyName + ') ref ' + pay.bankReference + '. Sisa Rp ' + D.sub(inv.netAmount, inv.paidAmount) + '.', before: { paidAmount: prevPaid }, after: { paidAmount: inv.paidAmount, status: inv.status } });
  return pay;
}

function payInvoice_(actor, p) {
  return mut_(function (tx) {
    var inv = Db.byId('Invoices', p.invoiceId);
    if (!inv) throw new AppError(404, 'INVOICE_NOT_FOUND', 'Faktur tidak ditemukan.');
    assertProject_(actor, inv.projectId, 'FINANCE_PAYMENT_POST');
    if (inv.status === STATUS.VOID) throw new AppError(409, 'INVOICE_VOID', 'Faktur sudah dibatalkan.');
    var pay = postPayment_(tx, actor, inv, p);
    if (inv.invoiceType === 'AR_PROGRESS_BILLING') { Notify.queue('Pembayaran konsumen diterima: ' + inv.invoiceNumber + ' Rp ' + pay.amount + '.'); if (p.notifyCustomer !== false) paymentReceipt_(inv, pay); }
    return { payment: pay, invoice: inv };
  });
}

function voidInvoice_(actor, p) {
  return mut_(function (tx) {
    var inv = Db.byId('Invoices', p.invoiceId);
    if (!inv) throw new AppError(404, 'INVOICE_NOT_FOUND', 'Faktur tidak ditemukan.');
    assertProject_(actor, inv.projectId, 'FINANCE_INVOICE_CREATE');
    if (D.isPos(inv.paidAmount)) throw new AppError(409, 'INVOICE_HAS_PAYMENT', 'Faktur yang sudah ada pembayarannya tidak bisa dibatalkan.');
    if (inv.status === STATUS.VOID) throw new AppError(409, 'INVOICE_VOID', 'Faktur sudah dibatalkan.');
    if (['AP_SUBCON', 'AP_RETENTION'].indexOf(inv.invoiceType) >= 0) throw new AppError(409, 'SYSTEM_INVOICE', 'Faktur otomatis dari opname/retensi tidak dapat dibatalkan.');
    inv.status = STATUS.VOID; inv.notes = (inv.notes ? inv.notes + ' ' : '') + '[BATAL: ' + V.str(p.reason, 'Alasan pembatalan', 300) + ']';
    tx.update('Invoices', inv);
    if (inv.sourceDocType === 'PO_GRN' && inv.sourceDocId) {
      var po = Db.byId('PurchaseOrders', inv.sourceDocId);
      if (po) { po.invoicedAmount = D.sub(po.invoicedAmount, D.add(inv.grossAmount, inv.taxAmount)); tx.update('PurchaseOrders', po); }
    }
    audit_(tx, actor, { projectId: inv.projectId, houseUnitId: inv.houseUnitId, action: 'FINANCE_INVOICE_VOIDED', entityType: 'Invoice', entityId: inv.id, sourceReference: inv.invoiceNumber, summary: 'Pembatalan faktur ' + inv.invoiceNumber + ': ' + p.reason + '.', before: { status: STATUS.POSTED }, after: { status: STATUS.VOID } });
    return inv;
  });
}

function reconcilePayment_(actor, p) {
  return mut_(function (tx) {
    var pay = Db.byId('Payments', p.paymentId);
    if (!pay) throw new AppError(404, 'PAYMENT_NOT_FOUND', 'Voucher pembayaran tidak ditemukan.');
    assertProject_(actor, pay.projectId, 'FINANCE_PAYMENT_POST');
    if (pay.reconciled) throw new AppError(409, 'ALREADY_RECONCILED', 'Pembayaran ' + pay.paymentNumber + ' sudah direkonsiliasi.');
    var before = pay.bankReference;
    pay.reconciled = true; pay.reconciledAt = nowIso_(); pay.reconciledByUserId = actor.id;
    if (p.bankReference) pay.bankReference = V.opt(p.bankReference, 80);
    tx.update('Payments', pay);
    audit_(tx, actor, { projectId: pay.projectId, houseUnitId: pay.houseUnitId, action: 'FINANCE_PAYMENT_RECONCILED', entityType: 'Payment', entityId: pay.id, sourceReference: pay.paymentNumber, summary: 'Rekonsiliasi rekening koran ' + pay.paymentNumber + ' (' + pay.bankReference + ') Rp ' + pay.amount + '.', before: { reconciled: false, bankReference: before }, after: { reconciled: true, bankReference: pay.bankReference } });
    return pay;
  });
}

/** Umur hutang/piutang (aging) per proyek */
function agingReport_(projectId) {
  var today = today_();
  var buckets = function () { return { current: '0.00', d1_30: '0.00', d31_60: '0.00', d61_90: '0.00', d90p: '0.00', total: '0.00' }; };
  var ap = buckets(), ar = buckets(), dueSoon = [];
  Db.where('Invoices', function (i) { return i.projectId === projectId && i.status !== STATUS.VOID; }).forEach(function (i) {
    var open = D.sub(i.netAmount, i.paidAmount);
    if (!D.isPos(open)) return;
    var b = i.invoiceType === 'AR_PROGRESS_BILLING' ? ar : ap;
    var days = Math.floor((new Date(today) - new Date(i.dueDate || today)) / 86400000);
    var key = days <= 0 ? 'current' : days <= 30 ? 'd1_30' : days <= 60 ? 'd31_60' : days <= 90 ? 'd61_90' : 'd90p';
    b[key] = D.add(b[key], open); b.total = D.add(b.total, open);
    if (days > -7) dueSoon.push({ id: i.id, invoiceNumber: i.invoiceNumber, invoiceType: i.invoiceType, counterpartyName: i.counterpartyName, dueDate: i.dueDate, openAmount: open, daysOverdue: days });
  });
  dueSoon.sort(function (a, b) { return b.daysOverdue - a.daysOverdue; });
  return { ap: ap, ar: ar, dueSoon: dueSoon.slice(0, 20) };
}

/** Tanda terima pembayaran ke konsumen (WhatsApp/email) — hanya untuk tagihan ke konsumen, bukan pencairan bank KPR */
function paymentReceipt_(inv, pay) {
  if (inv.billTo === 'BANK' || !inv.houseUnitId) return;
  var unit = Db.byId('HouseUnits', inv.houseUnitId); if (!unit) return;
  var s = getSettings_();
  unitRecipients_(unit).forEach(function (r) {
    var t = 'Yth. ' + r.name + ',\nPembayaran Anda sebesar ' + rupiah_(pay.amount) + ' untuk ' + inv.invoiceNumber + ' (' + (inv.sourceDocNumber || 'termin') + ', rumah ' + unit.unitNumber + ') sudah kami terima. ' +
      (D.isPos(D.sub(inv.netAmount, inv.paidAmount)) ? 'Sisa tagihan: ' + rupiah_(D.sub(inv.netAmount, inv.paidAmount)) + '.' : 'Tagihan ini LUNAS.') + '\nNo. bukti: ' + pay.paymentNumber + '\n\nTerima kasih.\n' + (s.companyName || '');
    var meta = { kind: 'PAYMENT_RECEIPT', name: r.name, projectId: inv.projectId, refType: 'Payment', refId: pay.id, refNo: pay.paymentNumber };
    if (r.phone) Notify.wa(r.phone, t, meta); if (r.email) Notify.email(r.email, 'Pembayaran diterima — ' + inv.invoiceNumber, t, meta);
  });
}

/* ============================ Otomatisasi perbankan: impor mutasi rekening ============================ */
/**
 * Cocokkan baris mutasi rekening (kredit/masuk) dengan tagihan konsumen yang masih terbuka.
 * rows: [{ date, description, amount, reference }]. Skor: nomor tagihan di berita (100), nomor kavling + nominal pas (80),
 * nama pembeli + nominal pas (70), nominal pas dan unik (50). Baris yang referensinya sudah tercatat dilewati (anti dobel).
 */
function bankMatch_(actor, p) {
  var prj = assertProject_(actor, p.projectId, 'FINANCE_PAYMENT_POST');
  var rows = (p.rows || []).slice(0, 500);
  if (!rows.length) throw new AppError(400, 'VALIDATION_ERROR', 'Tidak ada baris mutasi untuk dicocokkan.');
  var norm = function (x) { return String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  var invs = Db.where('Invoices', function (i) { return i.projectId === prj.id && i.invoiceType === 'AR_PROGRESS_BILLING' && i.status !== STATUS.VOID && D.isPos(D.sub(i.netAmount, i.paidAmount)); });
  var units = {}; Db.where('HouseUnits', function (u) { return u.projectId === prj.id; }).forEach(function (u) { units[u.id] = u; });
  var refs = {}; Db.where('Payments', function (x) { return x.projectId === prj.id; }).forEach(function (x) { refs[norm(x.bankReference)] = x.paymentNumber; });
  var used = {};
  return rows.map(function (r, idx) {
    var amt = String(r.amount || '').replace(/[^\d.,-]/g, '');
    if (/,\d{1,2}$/.test(amt)) amt = amt.replace(/\./g, '').replace(',', '.'); else amt = amt.replace(/,/g, '');
    var out = { row: idx, date: String(r.date || '').slice(0, 30), description: String(r.description || '').slice(0, 300), amount: amt, reference: String(r.reference || '').slice(0, 80), match: null, score: 0, reason: '' };
    if (!amt || isNaN(Number(amt)) || Number(amt) <= 0) { out.reason = 'Bukan dana masuk'; return out; }
    out.amount = D.money(amt);
    var ref = out.reference || ('MUTASI ' + out.date + ' ' + out.amount);
    out.reference = ref.slice(0, 80);
    if (refs[norm(out.reference)]) { out.reason = 'Sudah tercatat (' + refs[norm(out.reference)] + ')'; return out; }
    var desc = norm(out.description), best = null;
    invs.forEach(function (i) {
      var open = D.sub(i.netAmount, i.paidAmount), u = units[i.houseUnitId] || {};
      var exact = D.cmp(out.amount, open) === 0, fits = D.cmp(out.amount, open) <= 0, sc = 0, why = '';
      var no = norm(i.invoiceNumber), tail = no.slice(-10);
      if (desc && (desc.indexOf(no) >= 0 || (tail.length >= 8 && desc.indexOf(tail) >= 0))) { sc = fits ? 100 : 60; why = 'Nomor tagihan di berita transfer'; }
      else if (u.unitNumber && desc.indexOf(norm(u.unitNumber)) >= 0 && exact) { sc = 80; why = 'Kavling ' + u.unitNumber + ' & nominal sama'; }
      else if (exact && u.buyerName && String(u.buyerName).toUpperCase().replace(/\(.*?\)/g, ' ').split(/[^A-Z]+/).some(function (w) { return w.length >= 4 && ['BAPAK', 'IBU'].indexOf(w) < 0 && desc.indexOf(w) >= 0; })) { sc = 70; why = 'Nama pembeli & nominal sama'; }
      else if (exact) { sc = 50; why = 'Nominal sama dengan sisa tagihan'; }
      if (sc && used[i.id]) sc -= 30;
      if (sc > (best ? best.score : 0)) best = { score: sc, why: why, inv: i, unit: u, open: open };
    });
    if (best && best.score === 50) {
      var same = invs.filter(function (i) { return D.cmp(D.sub(i.netAmount, i.paidAmount), out.amount) === 0; });
      if (same.length > 1) { best.score = 30; best.why = 'Nominal cocok dengan ' + same.length + ' tagihan — periksa manual'; }
    }
    if (best) {
      used[best.inv.id] = 1;
      out.match = { invoiceId: best.inv.id, invoiceNumber: best.inv.invoiceNumber, label: best.inv.sourceDocNumber, unitNumber: best.unit.unitNumber || '', buyerName: best.unit.buyerName || best.inv.counterpartyName, open: best.open, partial: D.cmp(out.amount, best.open) < 0 };
      out.score = best.score; out.reason = best.why;
    } else out.reason = 'Tidak ada tagihan terbuka yang cocok';
    return out;
  });
}
/** Bukukan pasangan mutasi–tagihan yang dipilih: pembayaran + langsung berstatus rekonsiliasi */
function bankApply_(actor, p) {
  var items = (p.items || []).slice(0, 200);
  if (!items.length) throw new AppError(400, 'VALIDATION_ERROR', 'Pilih minimal satu pasangan untuk dibukukan.');
  var receipts = [];
  var res = mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'FINANCE_PAYMENT_POST');
    var out = [];
    items.forEach(function (it) {
      var inv = Db.byId('Invoices', it.invoiceId);
      if (!inv || inv.projectId !== prj.id || inv.invoiceType !== 'AR_PROGRESS_BILLING') throw new AppError(404, 'INVOICE_NOT_FOUND', 'Tagihan tidak ditemukan: ' + it.invoiceId);
      var dup = Db.find('Payments', function (x) { return x.projectId === prj.id && String(x.bankReference).toUpperCase() === String(it.reference || '').toUpperCase(); });
      if (dup) throw new AppError(409, 'DUPLICATE_BANK_REF', 'Referensi ' + it.reference + ' sudah dibukukan sebagai ' + dup.paymentNumber + '.');
      var pay = postPayment_(tx, actor, inv, { amount: it.amount, paymentMethod: it.method === 'ESCROW_KPR' ? 'ESCROW_KPR' : 'BANK_TRANSFER', bankReference: V.str(it.reference, 'Referensi mutasi', 80) });
      pay.reconciled = true; pay.reconciledAt = nowIso_(); pay.reconciledByUserId = actor.id; tx.update('Payments', pay);
      audit_(tx, actor, { projectId: prj.id, houseUnitId: inv.houseUnitId, action: 'BANK_STATEMENT_MATCHED', entityType: 'Payment', entityId: pay.id, sourceReference: pay.bankReference + ' -> ' + inv.invoiceNumber, summary: 'Mutasi rekening ' + pay.bankReference + ' Rp ' + pay.amount + ' dicocokkan otomatis ke ' + inv.invoiceNumber + ' (' + (it.reason || 'manual') + ').' });
      receipts.push([inv, pay]);
      out.push({ paymentNumber: pay.paymentNumber, invoiceNumber: inv.invoiceNumber, amount: pay.amount });
    });
    return out;
  });
  if (p.notifyCustomer !== false) receipts.forEach(function (x) { paymentReceipt_(x[0], x[1]); });
  return { posted: res };
}

/* ---- SvcQuality.gs ---- */
/**
 * SvcQuality.gs — Inspeksi QC, perbaikan & penutupan defect, BAST serah terima + garansi, klaim garansi.
 */
var QC_STAGES = ['PONDASI_SLOOF', 'STRUKTUR_ATAP', 'MEP_PLUMBING', 'FINISHING_FINAL', 'PRA_SERAH_TERIMA'];

function createQc_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'QC_INSPECT');
    var unit = unitOf_(prj, p.houseUnitId, true);
    var stage = V.oneOf(p.stage, QC_STAGES, 'Tahap inspeksi');
    var score = V.pct(p.checklistScorePct, 'Skor checklist');
    var s = getSettings_();
    var passed = D.cmp(score, s.qcPassScore || '90') >= 0;
    var defect = V.opt(p.defectDescription, 2000);
    if (!passed && !defect) throw new AppError(400, 'VALIDATION_ERROR', 'Uraian temuan defect wajib diisi bila skor di bawah ambang lulus (' + s.qcPassScore + '%).');
    var qc = tx.insert('QcInspections', {
      id: uid_('qc'), projectId: prj.id, houseUnitId: unit.id, inspectionNumber: nextDocNo_(tx, 'QC'), stage: stage, checklistScorePct: score,
      passed: passed, defectDescription: defect, defectStatus: passed ? (defect ? 'OPEN' : 'NONE') : 'OPEN', rectificationNotes: '',
      rectifiedAt: '', closedAt: '', closureNotes: '', bastNumber: '', warrantyMonths: 0, inspectorUserId: actor.id, createdAt: nowIso_()
    });
    if (passed && stage === 'PRA_SERAH_TERIMA' && unit.status !== 'HANDED_OVER') {
      unit.status = 'HANDOVER_READY'; tx.update('HouseUnits', unit);
    }
    audit_(tx, actor, { projectId: prj.id, houseUnitId: unit.id, action: 'QC_INSPECTION_RECORDED', entityType: 'QcInspection', entityId: qc.id, sourceReference: qc.inspectionNumber, summary: 'Inspeksi ' + qc.inspectionNumber + ' kavling ' + unit.unitNumber + ' (' + stage + '): skor ' + score + '% — ' + (passed ? 'LULUS' : 'TEMUAN DEFECT') + '.', after: qc });
    if (qc.defectStatus === 'OPEN') Notify.queue('Defect QC ' + qc.inspectionNumber + ' kavling ' + unit.unitNumber + ': ' + defect.slice(0, 120));
    return qc;
  });
}

function rectifyDefect_(actor, p) {
  return mut_(function (tx) {
    var qc = Db.byId('QcInspections', p.id);
    if (!qc) throw new AppError(404, 'QC_NOT_FOUND', 'Inspeksi QC tidak ditemukan.');
    assertProject_(actor, qc.projectId);
    if (!perm_(actor.role, 'QC_INSPECT') && !perm_(actor.role, 'DAILY_REPORT_SUBMIT')) assertPerm_(actor, 'QC_INSPECT'); // tim lapangan boleh mencatat perbaikan
    if (qc.defectStatus !== 'OPEN') throw new AppError(409, 'DEFECT_NOT_OPEN', 'Defect berstatus ' + qc.defectStatus + '; hanya defect OPEN yang dapat diperbaiki.');
    qc.defectStatus = 'RECTIFIED'; qc.rectificationNotes = V.str(p.rectificationNotes, 'Catatan perbaikan', 2000); qc.rectifiedAt = nowIso_();
    tx.update('QcInspections', qc);
    audit_(tx, actor, { projectId: qc.projectId, houseUnitId: qc.houseUnitId, action: 'QC_DEFECT_RECTIFIED', entityType: 'QcInspection', entityId: qc.id, sourceReference: qc.inspectionNumber, summary: 'Perbaikan defect ' + qc.inspectionNumber + ': ' + qc.rectificationNotes + '. Menunggu verifikasi.', before: { defectStatus: 'OPEN' }, after: { defectStatus: 'RECTIFIED' } });
    return qc;
  });
}

function closeDefect_(actor, p) {
  return mut_(function (tx) {
    var qc = Db.byId('QcInspections', p.id);
    if (!qc) throw new AppError(404, 'QC_NOT_FOUND', 'Inspeksi QC tidak ditemukan.');
    assertProject_(actor, qc.projectId, 'QC_INSPECT');
    if (qc.defectStatus !== 'RECTIFIED') throw new AppError(409, 'DEFECT_NOT_RECTIFIED', 'Defect harus berstatus RECTIFIED sebelum ditutup.');
    var s = getSettings_();
    var score = V.pct(p.reInspectionScorePct, 'Skor verifikasi');
    if (D.cmp(score, s.qcPassScore || '90') < 0) throw new AppError(400, 'INSUFFICIENT_CLOSURE_SCORE', 'Skor verifikasi (' + score + '%) minimal ' + s.qcPassScore + '% untuk menutup defect.');
    var before = { defectStatus: qc.defectStatus, passed: qc.passed, checklistScorePct: qc.checklistScorePct };
    qc.defectStatus = 'CLOSED'; qc.passed = true; qc.checklistScorePct = score; qc.closedAt = nowIso_(); qc.closureNotes = V.opt(p.closureNotes, 1000);
    tx.update('QcInspections', qc);
    var unit = Db.byId('HouseUnits', qc.houseUnitId);
    if (qc.stage === 'PRA_SERAH_TERIMA' && unit && unit.status !== 'HANDED_OVER') { unit.status = 'HANDOVER_READY'; tx.update('HouseUnits', unit); }
    audit_(tx, actor, { projectId: qc.projectId, houseUnitId: qc.houseUnitId, action: 'QC_DEFECT_CLOSED', entityType: 'QcInspection', entityId: qc.id, sourceReference: qc.inspectionNumber, summary: 'Verifikasi defect ' + qc.inspectionNumber + ' LULUS (skor ' + score + '%). Defect ditutup.', before: before, after: { defectStatus: 'CLOSED', passed: true, checklistScorePct: score } });
    return qc;
  });
}

/** BAST: hanya bila progres ≥ ambang, tidak ada defect terbuka, dan sudah lulus QC pra-serah-terima */
function issueBast_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'HANDOVER_ISSUE');
    var unit = unitOf_(prj, p.houseUnitId, true);
    if (unit.status === 'HANDED_OVER') throw new AppError(409, 'ALREADY_HANDED_OVER', 'Kavling ' + unit.unitNumber + ' sudah serah terima.');
    var s = getSettings_();
    if (D.cmp(unit.progressPercent, s.bastMinProgress || '90') < 0) throw new AppError(400, 'PROGRESS_INSUFFICIENT', 'Progres kavling ' + unit.progressPercent + '% (minimal ' + s.bastMinProgress + '% untuk BAST).');
    var qcs = Db.where('QcInspections', function (q) { return q.houseUnitId === unit.id; });
    var open = qcs.filter(function (q) { return q.defectStatus === 'OPEN' || q.defectStatus === 'RECTIFIED'; });
    if (open.length) throw new AppError(400, 'OPEN_DEFECTS', 'Masih ada ' + open.length + ' defect belum ditutup (' + open.map(function (q) { return q.inspectionNumber; }).join(', ') + ').');
    var pre = qcs.filter(function (q) { return q.stage === 'PRA_SERAH_TERIMA' && q.passed; });
    if (!pre.length) throw new AppError(400, 'NO_PRE_HANDOVER_QC', 'Belum ada inspeksi QC tahap PRA_SERAH_TERIMA yang lulus.');
    var buyer = V.opt(p.customerName, 120) || unit.buyerName;
    if (!buyer) throw new AppError(400, 'VALIDATION_ERROR', 'Nama konsumen penerima wajib diisi.');
    var months = Math.max(1, Math.min(60, parseInt(p.warrantyMonths, 10) || Number(s.defaultWarrantyMonths) || 3));
    var hd = p.handoverDate ? V.date(p.handoverDate, 'Tanggal serah terima') : today_();
    var bastNo = nextDocNo_(tx, 'BAST', unit.unitNumber.replace(/[^A-Z0-9-]/gi, ''));
    var before = { status: unit.status, progressPercent: unit.progressPercent };
    unit.status = 'HANDED_OVER'; unit.progressPercent = '100.00'; unit.handoverDate = hd; unit.warrantyEndDate = addMonths_(hd, months);
    if (!unit.buyerName) unit.buyerName = buyer;
    tx.update('HouseUnits', unit);
    var qc = tx.insert('QcInspections', {
      id: uid_('qc'), projectId: prj.id, houseUnitId: unit.id, inspectionNumber: nextDocNo_(tx, 'QC'), stage: 'PRA_SERAH_TERIMA', checklistScorePct: '100.00',
      passed: true, defectDescription: V.opt(p.handoverNotes, 1000) || 'Serah terima kunci & dokumen garansi kepada konsumen.', defectStatus: 'NONE',
      rectificationNotes: '', rectifiedAt: '', closedAt: '', closureNotes: '', bastNumber: bastNo, warrantyMonths: months, inspectorUserId: actor.id, createdAt: nowIso_()
    });
    var bill = null;
    if (p.generateFinalBilling) {
      assertPerm_(actor, 'FINANCE_INVOICE_CREATE');
      var amt = D.money(V.pos(p.billingAmount, 'Nilai tagihan akhir'));
      bill = tx.insert('Invoices', {
        id: uid_('inv'), projectId: prj.id, houseUnitId: unit.id, invoiceNumber: nextDocNo_(tx, 'INV-AR'), invoiceType: 'AR_PROGRESS_BILLING',
        sourceDocType: 'CUSTOMER_BAST', sourceDocNumber: bastNo, sourceDocId: unit.id, counterpartyName: buyer, grossAmount: amt, taxAmount: '0.00',
        retentionAmount: '0.00', netAmount: amt, paidAmount: '0.00', status: STATUS.POSTED, invoiceDate: hd, dueDate: addDays_(hd, 14),
        notes: 'Tagihan akhir serah terima', createdByUserId: actor.id, createdAt: nowIso_()
      });
    }
    audit_(tx, actor, { projectId: prj.id, houseUnitId: unit.id, action: 'QC_OFFICIAL_BAST_ISSUED', entityType: 'HouseUnit', entityId: unit.id, sourceReference: bastNo, summary: 'BAST ' + bastNo + ' kavling ' + unit.unitNumber + ' kepada ' + buyer + '. Garansi ' + months + ' bulan s/d ' + unit.warrantyEndDate + '.', before: before, after: { status: unit.status, handoverDate: hd, warrantyEndDate: unit.warrantyEndDate, bastNumber: bastNo } });
    return { unit: unit, bastNumber: bastNo, bastQc: qc, finalBillingInvoice: bill };
  });
}

function updateWarrantyClaim_(actor, p) {

/* ---- SvcSupply.gs ---- */
/**
 * SvcSupply.gs — Material Request → Persetujuan → PO → GRN → Pengeluaran ke kavling, mutasi & penyesuaian stok.
 * Penilaian persediaan memakai rata-rata tertimbang bergerak (moving average cost) per gudang.
 */

/** Saldo & HPP rata-rata terakhir untuk gudang+material */
function stockState_(warehouseId, materialId) {
  var last = null;
  var rows = Db.all('StockLedger');
  for (var i = 0; i < rows.length; i++) {
    var l = rows[i];
    if (l.warehouseId === warehouseId && l.materialId === materialId && (!last || Number(l.seq) > Number(last.seq))) last = l;
  }
  if (!last) return { qty: '0.0000', avgCost: '0.00', value: '0.00' };
  return { qty: D.qty(last.balanceAfter), avgCost: D.money(last.avgCostAfter), value: D.mul(last.balanceAfter, last.avgCostAfter) };
}
function nextLedgerSeq_() {
  var max = 0; Db.all('StockLedger').forEach(function (l) { if (Number(l.seq) > max) max = Number(l.seq); });
  return max + 1;
}
/** Tulis mutasi stok (IN/OUT) dan hitung HPP rata-rata baru */
function postLedger_(tx, actor, e) {
  var st = stockState_(e.warehouseId, e.material.id);
  var qIn = D.qty(e.qtyIn || '0'), qOut = D.qty(e.qtyOut || '0');
  var newQty = D.subQ(D.addQ(st.qty, qIn), qOut);
  if (D.isNeg(newQty)) {
    throw new AppError(400, 'INSUFFICIENT_WAREHOUSE_STOCK', 'Stok ' + e.material.name + ' tidak mencukupi di ' + e.warehouseName + ': tersedia ' + st.qty + ' ' + e.material.unit + ', diminta ' + qOut + '.');
  }
  var unitCost, totalCost, avgAfter;
  if (D.isPos(qIn)) {
    unitCost = D.money(e.unitCost);
    totalCost = D.mul(qIn, unitCost);
    var newValue = D.add(st.value, totalCost);
    avgAfter = D.isPos(newQty) ? D.divMoney(newValue, newQty) : unitCost;
  } else {
    unitCost = D.isPos(st.avgCost) ? st.avgCost : D.money(e.material.standardPrice);
    totalCost = D.mul(qOut, unitCost);
    avgAfter = D.isPos(newQty) ? unitCost : '0.00';
  }
  var row = {
    id: uid_('stk'), seq: nextLedgerSeq_(), warehouseId: e.warehouseId, projectId: e.projectId || '', houseUnitId: e.houseUnitId || '',
    wbsCode: e.wbsCode || '', materialId: e.material.id, materialCode: e.material.code, materialName: e.material.name, unit: e.material.unit,
    movementType: e.movementType, referenceDocType: e.refType, referenceDocNo: e.refNo, quantityIn: qIn, quantityOut: qOut,
    balanceAfter: newQty, unitCost: unitCost, totalCost: totalCost, avgCostAfter: avgAfter, notes: e.notes || '',
    recordedByUserId: actor.id, createdAt: nowIso_()
  };
  tx.insert('StockLedger', row);
  return { row: row, before: st };
}

function materialOrThrow_(id) {
  var m = Db.byId('Materials', id);
  if (!m || m.deletedAt) throw new AppError(404, 'MATERIAL_NOT_FOUND', 'Material tidak ditemukan.');
  return m;
}
function warehouseOrThrow_(id) {
  var w = Db.byId('Warehouses', id);
  if (!w || w.deletedAt) throw new AppError(404, 'WAREHOUSE_NOT_FOUND', 'Gudang tidak ditemukan.');
  return w;
}
function unitOf_(prj, unitId, required) {
  if (!unitId) { if (required) throw new AppError(400, 'VALIDATION_ERROR', 'Kavling wajib dipilih.'); return null; }
  var u = Db.byId('HouseUnits', unitId);
  if (!u || u.projectId !== prj.id || u.deletedAt) throw new AppError(404, 'UNIT_NOT_FOUND', 'Kavling tidak ditemukan pada proyek ini.');
  return u;
}

/* ----------------------------- Material Request ----------------------------- */
function createMr_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'MR_CREATE');
    var unit = unitOf_(prj, p.houseUnitId, false);
    var mat = materialOrThrow_(p.materialId);
    var qty = D.qty(V.pos(p.requestedQty, 'Jumlah diminta'));
    var quota = calcQuotas_(prj.id).filter(function (q) { return q.materialId === mat.id; })[0];
    var over = quota ? D.cmp(qty, quota.remainingQuotaQty) > 0 : false;
    var overrideReason = V.opt(p.overrideReason, 300);
    if (over) {
      if (!p.allowOverQuota) {
        throw new AppError(400, 'MR_EXCEEDS_RAB_QUOTA', 'Permintaan ' + mat.name + ' (' + qty + ' ' + mat.unit + ') melebihi sisa kuota RAB (' + quota.remainingQuotaQty + ' dari plafon ' + quota.rabQuotaQty + ' ' + mat.unit + '). Ajukan revisi RAB (CCO) atau centang "ajukan melebihi kuota" dengan alasan.');
      }
      if (!overrideReason) throw new AppError(400, 'VALIDATION_ERROR', 'Alasan wajib diisi untuk permintaan di atas kuota RAB.');
    }
    var wbs = V.opt(p.wbsCode, 20).toUpperCase();
    var rabItem = Db.find('RabItems', function (i) { return i.projectId === prj.id && (!unit || i.houseUnitId === unit.id) && i.wbsCode === wbs && isRabApproved_(i.rabBudgetId); });
    var mr = tx.insert('MaterialRequests', {
      id: uid_('mr'), projectId: prj.id, houseUnitId: unit ? unit.id : '', wbsCode: wbs, rabItemId: rabItem ? rabItem.id : '',
      mrNumber: nextDocNo_(tx, 'MR'), materialId: mat.id, materialCode: mat.code, materialName: mat.name, unit: mat.unit,
      requestedQty: qty, estimatedUnitPrice: mat.standardPrice, estimatedTotal: D.mul(qty, mat.standardPrice),
      status: STATUS.SUBMITTED, overQuota: over, overrideReason: over ? overrideReason : '', requestedByUserId: actor.id,
      approvedByUserId: '', approvedAt: '', rejectionReason: '', purchaseOrderId: '',
      neededByDate: p.neededByDate ? V.date(p.neededByDate, 'Dibutuhkan tanggal') : addDays_(today_(), 7),
      notes: V.opt(p.notes, 500), createdAt: nowIso_()
    });
    audit_(tx, actor, { projectId: prj.id, houseUnitId: mr.houseUnitId, action: 'MATERIAL_REQUEST_SUBMITTED', entityType: 'MaterialRequest', entityId: mr.id, sourceReference: (wbs || '-') + ' -> ' + mr.mrNumber, summary: 'Pengajuan ' + mr.mrNumber + ': ' + qty + ' ' + mat.unit + ' ' + mat.name + ' (est. Rp ' + mr.estimatedTotal + ')' + (over ? ' [DI ATAS KUOTA: ' + overrideReason + ']' : '') + '.', after: mr });
    Notify.queue('MR baru ' + mr.mrNumber + ' (' + prj.code + '): ' + qty + ' ' + mat.unit + ' ' + mat.name + ' menunggu persetujuan.');
    if (mr.status === STATUS.SUBMITTED) approvalAlert_({ projectId: prj.id, kind: 'MR', refType: 'MaterialRequest', refId: mr.id, refNo: mr.mrNumber, amount: mr.estimatedTotal, link: '#/supply/mr',
      title: 'Permintaan material ' + mr.mrNumber + (over ? ' (DI ATAS KUOTA RAB)' : ''),
      lines: ['Material: ' + mat.name + ' — ' + D.qty(qty) + ' ' + mat.unit, 'Estimasi: ' + rupiah_(mr.estimatedTotal), 'Kavling: ' + (unit ? unit.unitNumber : 'proyek') + (wbs ? ' / ' + wbs : ''), 'Diajukan: ' + actor.fullName + ', dibutuhkan ' + tglIndo_(mr.neededByDate)].concat(over ? ['Alasan di atas kuota: ' + overrideReason] : []) });
    return mr;
  });
}

function decideMr_(actor, p) {
  return mut_(function (tx) {
    var mr = Db.byId('MaterialRequests', p.id);
    if (!mr) throw new AppError(404, 'MR_NOT_FOUND', 'Material Request tidak ditemukan.');
    var prj = assertProject_(actor, mr.projectId, 'MR_APPROVE');
    if (mr.status !== STATUS.SUBMITTED) throw new AppError(409, 'MR_ALREADY_PROCESSED', 'MR ' + mr.mrNumber + ' sudah diproses (' + mr.status + ').');
    var approve = p.decision === 'APPROVE';
    if (approve) {
      // validasi ulang kuota saat persetujuan (MR lain mungkin sudah disetujui sejak pengajuan)
      var quota = calcQuotas_(prj.id).filter(function (q) { return q.materialId === mr.materialId; })[0];
      if (quota && D.cmp(quota.requestedMrQty, quota.rabQuotaQty) > 0 && !mr.overQuota) {
        throw new AppError(400, 'MR_EXCEEDS_RAB_QUOTA', 'Total permintaan ' + mr.materialName + ' kini melebihi plafon RAB (' + quota.requestedMrQty + ' > ' + quota.rabQuotaQty + '). Tolak MR atau ajukan revisi RAB.');
      }
      mr.status = STATUS.APPROVED; mr.approvedByUserId = actor.id; mr.approvedAt = nowIso_();
    } else {
      mr.status = STATUS.REJECTED; mr.rejectionReason = V.str(p.reason, 'Alasan penolakan', 300);
      mr.approvedByUserId = actor.id; mr.approvedAt = nowIso_();
    }
    tx.update('MaterialRequests', mr);
    notifyRequester_(mr.requestedByUserId, 'MR ' + mr.mrNumber + ' (' + mr.materialName + ') ' + (approve ? 'DISETUJUI' : 'DITOLAK: ' + mr.rejectionReason) + ' oleh ' + actor.fullName + '.', { projectId: mr.projectId, refType: 'MaterialRequest', refId: mr.id, refNo: mr.mrNumber });
    audit_(tx, actor, { projectId: mr.projectId, houseUnitId: mr.houseUnitId, action: approve ? 'MATERIAL_REQUEST_APPROVED' : 'MATERIAL_REQUEST_REJECTED', entityType: 'MaterialRequest', entityId: mr.id, sourceReference: mr.mrNumber, summary: (approve ? 'Persetujuan ' : 'Penolakan ') + mr.mrNumber + ' oleh ' + actor.fullName + (approve ? '' : ': ' + mr.rejectionReason) + '.', before: { status: STATUS.SUBMITTED }, after: { status: mr.status } });
    return mr;
  });
}

/* ----------------------------- Purchase Order ----------------------------- */
function createPo_(actor, p) {
  return mut_(function (tx) {
    var mr = Db.byId('MaterialRequests', p.materialRequestId);
    if (!mr) throw new AppError(404, 'MR_NOT_FOUND', 'Material Request sumber tidak ditemukan.');
    var prj = assertProject_(actor, mr.projectId, 'PO_CREATE');
    if (mr.status === STATUS.ORDERED || mr.purchaseOrderId) throw new AppError(409, 'MR_ALREADY_ORDERED', 'MR ' + mr.mrNumber + ' sudah dibuatkan PO.');
    if (mr.status !== STATUS.APPROVED) throw new AppError(400, 'MR_NOT_APPROVED', 'PO hanya bisa dibuat dari MR berstatus APPROVED.');
    var v = Db.byId('Vendors', p.vendorId);
    if (!v || v.deletedAt) throw new AppError(404, 'VENDOR_NOT_FOUND', 'Vendor tidak ditemukan.');
    var s = getSettings_();
    var price = p.unitPrice ? D.money(V.pos(p.unitPrice, 'Harga satuan')) : mr.estimatedUnitPrice;
    var ppnPct = (p.ppnPercent === undefined || p.ppnPercent === '') ? s.ppnPercent : V.pct(p.ppnPercent, 'PPN');
    var subtotal = D.mul(mr.requestedQty, price);
    var ppn = D.pct(subtotal, ppnPct);
    var po = tx.insert('PurchaseOrders', {
      id: uid_('po'), projectId: mr.projectId, houseUnitId: mr.houseUnitId, poNumber: nextDocNo_(tx, 'PO'), materialRequestId: mr.id,
      mrNumber: mr.mrNumber, vendorId: v.id, vendorName: v.name, materialId: mr.materialId, materialName: mr.materialName,
      unit: mr.unit, orderedQty: mr.requestedQty, receivedQty: '0.0000', unitPrice: price, subtotal: subtotal,
      ppnPercent: ppnPct, ppnAmount: ppn, totalAmount: D.add(subtotal, ppn), invoicedAmount: '0.00', status: STATUS.OPEN,
      createdByUserId: actor.id, createdAt: nowIso_()
    });
    mr.status = STATUS.ORDERED; mr.purchaseOrderId = po.id; tx.update('MaterialRequests', mr);
    audit_(tx, actor, { projectId: po.projectId, houseUnitId: po.houseUnitId, action: 'PURCHASE_ORDER_ISSUED', entityType: 'PurchaseOrder', entityId: po.id, sourceReference: mr.mrNumber + ' -> ' + po.poNumber, summary: 'Penerbitan ' + po.poNumber + ' ke ' + v.name + ' dari ' + mr.mrNumber + ' senilai Rp ' + po.totalAmount + ' (PPN ' + ppnPct + '%).', after: po });
    return po;
  });
}

/* ----------------------------- Goods Receipt ----------------------------- */
function createGrn_(actor, p) {
  return mut_(function (tx) {
    var po = Db.byId('PurchaseOrders', p.purchaseOrderId);
    if (!po) throw new AppError(404, 'PO_NOT_FOUND', 'Purchase Order tidak ditemukan.');
    assertProject_(actor, po.projectId, 'GRN_RECORD');
    if (po.status === STATUS.RECEIVED || po.status === STATUS.VOID) throw new AppError(409, 'PO_CLOSED', 'PO ' + po.poNumber + ' sudah ' + po.status + '.');
    var wh = warehouseOrThrow_(p.warehouseId);
    var qty = D.qty(V.pos(p.receivedQty, 'Jumlah diterima'));
    var cum = D.addQ(po.receivedQty, qty);
    if (D.cmp(cum, po.orderedQty) > 0) throw new AppError(400, 'GRN_EXCEEDS_PO_QTY', 'Total diterima (' + cum + ') melebihi kuantitas PO (' + po.orderedQty + ').');
    var mat = materialOrThrow_(po.materialId);
    var grnNo = nextDocNo_(tx, 'GRN');
    var led = postLedger_(tx, actor, { warehouseId: wh.id, warehouseName: wh.name, projectId: po.projectId, houseUnitId: po.houseUnitId, material: mat, movementType: 'GOODS_RECEIPT', refType: 'GRN', refNo: grnNo, qtyIn: qty, unitCost: po.unitPrice });
    var grn = tx.insert('GoodsReceipts', {
      id: uid_('grn'), projectId: po.projectId, houseUnitId: po.houseUnitId, grnNumber: grnNo, purchaseOrderId: po.id, poNumber: po.poNumber,
      warehouseId: wh.id, warehouseName: wh.name, materialId: mat.id, materialName: mat.name, receivedQty: qty, unit: mat.unit,
      unitCost: po.unitPrice, totalCost: led.row.totalCost, deliveryNoteNumber: V.str(p.deliveryNoteNumber, 'No. surat jalan', 60),
      receivedByUserId: actor.id, status: STATUS.POSTED, createdAt: nowIso_()
    });
    po.receivedQty = cum; po.status = D.cmp(cum, po.orderedQty) === 0 ? STATUS.RECEIVED : STATUS.PARTIAL;
    tx.update('PurchaseOrders', po);
    audit_(tx, actor, { projectId: po.projectId, houseUnitId: po.houseUnitId, action: 'GOODS_RECEIPT_POSTED', entityType: 'GoodsReceipt', entityId: grn.id, sourceReference: po.mrNumber + ' -> ' + po.poNumber + ' -> ' + grnNo, summary: 'Penerimaan ' + grnNo + ' (SJ ' + grn.deliveryNoteNumber + '): +' + qty + ' ' + mat.unit + ' ' + mat.name + ' ke ' + wh.name + '.', before: { balance: led.before.qty }, after: { balance: led.row.balanceAfter, avgCost: led.row.avgCostAfter } });
    return grn;
  });
}

/* ----------------------------- Goods Issue ke kavling ----------------------------- */
function createGi_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'INVENTORY_ISSUE');
    var wh = warehouseOrThrow_(p.warehouseId);
    var mat = materialOrThrow_(p.materialId);
    var unit = unitOf_(prj, p.houseUnitId, true);
    var qty = D.qty(V.pos(p.issueQty, 'Jumlah keluar'));
    var giNo = nextDocNo_(tx, 'GI');
    var led = postLedger_(tx, actor, { warehouseId: wh.id, warehouseName: wh.name, projectId: prj.id, houseUnitId: unit.id, wbsCode: V.opt(p.wbsCode, 20).toUpperCase(), material: mat, movementType: 'PROJECT_ISSUE', refType: 'GI', refNo: giNo, qtyOut: qty, notes: V.opt(p.notes, 300) });
    audit_(tx, actor, { projectId: prj.id, houseUnitId: unit.id, action: 'INVENTORY_ISSUED_TO_UNIT', entityType: 'StockLedger', entityId: led.row.id, sourceReference: giNo + ' -> ' + unit.unitNumber + (led.row.wbsCode ? ' (' + led.row.wbsCode + ')' : ''), summary: 'Pengeluaran ' + giNo + ': -' + qty + ' ' + mat.unit + ' ' + mat.name + ' (Rp ' + led.row.totalCost + ') dibebankan ke kavling ' + unit.unitNumber + '.', before: { balance: led.before.qty }, after: { balance: led.row.balanceAfter } });
    lowStockCheck_(wh, mat, led.row.balanceAfter);
    return led.row;
  });
}

function lowStockCheck_(wh, mat, balance) {
  if (D.isPos(mat.minStockLevel) && D.cmp(balance, mat.minStockLevel) < 0) {
    Notify.queue('Stok menipis: ' + mat.name + ' di ' + wh.name + ' tinggal ' + D.qty(balance) + ' ' + mat.unit + ' (min. ' + mat.minStockLevel + ').');
  }
}

/* ----------------------------- Mutasi antar gudang ----------------------------- */
function transferStock_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'INVENTORY_ISSUE');
    if (p.fromWarehouseId === p.toWarehouseId) throw new AppError(400, 'INVALID_WAREHOUSE_TRANSFER', 'Gudang asal dan tujuan tidak boleh sama.');
    var from = warehouseOrThrow_(p.fromWarehouseId), to = warehouseOrThrow_(p.toWarehouseId);
    var mat = materialOrThrow_(p.materialId);
    var qty = D.qty(V.pos(p.transferQty, 'Jumlah mutasi'));
    var no = nextDocNo_(tx, 'TRF');
    var out = postLedger_(tx, actor, { warehouseId: from.id, warehouseName: from.name, projectId: prj.id, material: mat, movementType: 'TRANSFER_OUT', refType: 'TRANSFER', refNo: no, qtyOut: qty, notes: V.opt(p.notes, 300) });
    var inn = postLedger_(tx, actor, { warehouseId: to.id, warehouseName: to.name, projectId: to.projectId || prj.id, material: mat, movementType: 'TRANSFER_IN', refType: 'TRANSFER', refNo: no, qtyIn: qty, unitCost: out.row.unitCost, notes: V.opt(p.notes, 300) });
    audit_(tx, actor, { projectId: prj.id, action: 'WAREHOUSE_STOCK_TRANSFERRED', entityType: 'StockLedger', entityId: out.row.id, sourceReference: no + ' (' + from.code + ' -> ' + to.code + ')', summary: 'Mutasi ' + no + ': ' + qty + ' ' + mat.unit + ' ' + mat.name + ' dari ' + from.name + ' ke ' + to.name + ' @Rp ' + out.row.unitCost + '.', before: { from: out.before.qty, to: inn.before.qty }, after: { from: out.row.balanceAfter, to: inn.row.balanceAfter } });
    lowStockCheck_(from, mat, out.row.balanceAfter);
    return { transferDocNo: no, outEntry: out.row, inEntry: inn.row };
  });
}

/* ----------------------------- Penyesuaian stok (stock opname gudang) ----------------------------- */
function adjustStock_(actor, p) {
  return mut_(function (tx) {
    var prj = assertProject_(actor, p.projectId, 'STOCK_ADJUST');
    var wh = warehouseOrThrow_(p.warehouseId);
    var mat = materialOrThrow_(p.materialId);
    var counted = D.qty(V.nonneg(p.countedQty, 'Jumlah fisik'));
    var st = stockState_(wh.id, mat.id);
    var diff = D.subQ(counted, st.qty);
    if (D.isZero(diff)) throw new AppError(400, 'NO_DIFFERENCE', 'Jumlah fisik sama dengan saldo sistem; tidak ada penyesuaian.');
    var reason = V.str(p.reason, 'Alasan penyesuaian', 300);
    var no = nextDocNo_(tx, 'ADJ');
    var e = { warehouseId: wh.id, warehouseName: wh.name, projectId: prj.id, material: mat, movementType: 'ADJUSTMENT', refType: 'ADJ', refNo: no, notes: reason };
    if (D.isPos(diff)) { e.qtyIn = diff; e.unitCost = D.isPos(st.avgCost) ? st.avgCost : mat.standardPrice; }
    else e.qtyOut = D.qty(D.subQ('0', diff));
    var led = postLedger_(tx, actor, e);
    audit_(tx, actor, { projectId: prj.id, action: 'STOCK_ADJUSTED', entityType: 'StockLedger', entityId: led.row.id, sourceReference: no, summary: 'Penyesuaian stok ' + no + ' ' + mat.name + ' di ' + wh.name + ': sistem ' + st.qty + ' → fisik ' + counted + ' (' + reason + ').', before: { balance: st.qty }, after: { balance: led.row.balanceAfter } });
    return led.row;
  });
}

/** Ringkasan saldo semua gudang (untuk bootstrap & laporan) */
function stockBalances_() {
  var last = {};
  Db.all('StockLedger').forEach(function (l) {
    var k = l.warehouseId + '|' + l.materialId;
    if (!last[k] || Number(l.seq) > Number(last[k].seq)) last[k] = l;
  });
  var out = [];
  for (var k in last) {
    var l = last[k];
    out.push({ warehouseId: l.warehouseId, materialId: l.materialId, qty: D.qty(l.balanceAfter), avgCost: D.money(l.avgCostAfter), value: D.mul(l.balanceAfter, l.avgCostAfter) });
  }
  return out;
}

/**
 * System.gs — setup database, data demo, backup/restore ke Google Drive, trigger harian, pembersihan data & self-test.

var FAST_ = false;        // mode seed: lewati reset cache per transaksi (lebih cepat)
var SEED_NOW_ = null;     // mode seed: tanggal "sekarang" buatan agar riwayat demo realistis

/** Jalankan SEKALI dari editor Apps Script (atau menu HC-ERP → Setup). Aman diulang (migrasi). */
function setup() {
  try { ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL); } catch (e) { if (!/requireAllScopes/.test(String(e))) throw e; }   // minta ulang izin yang belum dicentang
  var created = Db.ensureSchema();
  var tx = new Db.Tx();
  var s = getSettings_();
  var existing = Db.all('Settings').map(function (r) { return r.key; });
  for (var k in DEFAULT_SETTINGS) if (existing.indexOf(k) < 0) setSetting_(tx, k, DEFAULT_SETTINGS[k]);
  var out = { createdSheets: created, admin: null };
  if (!Db.live('Users').length) {
    var email = '';
    try { email = Session.getEffectiveUser().getEmail(); } catch (e) { }
    email = (email || 'admin@hcerp.test').toLowerCase();
    var pw = 'Admin' + Math.random().toString(36).slice(2, 7) + '1';
    var salt = Utilities.getUuid();
    tx.insert('Users', { id: uid_('usr'), email: email, fullName: 'Administrator', role: ROLE.COMPANY_ADMIN, title: 'Admin Sistem', phone: '', passwordHash: hashPassword_(pw, salt), salt: salt, isActive: true, mustChangePassword: true, failedLogins: 0, lockedUntil: '', lastLoginAt: '', createdAt: nowIso_(), deletedAt: '' });
    if (!Db.live('Branches').length) tx.insert('Branches', { id: uid_('br'), code: 'PUSAT', name: 'Kantor Pusat', city: '', address: '', createdAt: nowIso_(), deletedAt: '' });
    out.admin = { email: email, password: pw };
  }
  tx.commit();
  Db.invalidate();
  scanAuditTail_();
  if (!PropertiesService.getScriptProperties().getProperty('TRIAL_START')) PropertiesService.getScriptProperties().setProperty('TRIAL_START', nowIso_());
  installTriggers_();
  var msg = 'Setup selesai. Sheet baru: ' + (created.join(', ') || '-') + (out.admin ? '\n\nAKUN ADMIN AWAL\nEmail: ' + out.admin.email + '\nPassword: ' + out.admin.password + '\n(Wajib diganti saat login pertama)' : '');
  console.log(msg);
  try { SpreadsheetApp.getUi().alert(msg); } catch (e) { }
  return out;
}

function installTriggers_(opt) {
  opt = opt || {};
  try {
    var all = ScriptApp.getProjectTriggers();
    if (opt.force) all.forEach(function (t) { if (t.getHandlerFunction() === 'reminderJob') ScriptApp.deleteTrigger(t); });
    var have = (opt.force ? ScriptApp.getProjectTriggers() : all).map(function (t) { return t.getHandlerFunction(); });
    var hour = parseInt(opt.reminderHour !== undefined ? opt.reminderHour : (getSettings_().reminderHour || '8'), 10);
    if (have.indexOf('reminderJob') < 0) ScriptApp.newTrigger('reminderJob').timeBased().everyDays(1).atHour(isNaN(hour) ? 8 : hour).create();
    if (have.indexOf('dailyJob') < 0) ScriptApp.newTrigger('dailyJob').timeBased().everyDays(1).atHour(1).create();
    if (have.indexOf('keepWarm') < 0) ScriptApp.newTrigger('keepWarm').timeBased().everyMinutes(10).create();
    if (have.indexOf('onSheetChange') < 0) ScriptApp.newTrigger('onSheetChange').forSpreadsheet(Db.ss()).onChange().create();
  } catch (e) { console.warn('Trigger gagal dibuat: ' + e); }
}

/** Trigger 10 menit: menjaga server tetap "hangat" & mengisi cache tabel agar request pertama pengguna cepat */
function keepWarm() {
  var s; try { Db.reset(); s = getSettings_(); } catch (e) { return; }
  if (s.keepWarm === 'OFF') return;
  var h = Number(Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'H'));
  if (s.keepWarm !== 'ALWAYS' && (h < 6 || h > 21)) return;   // hemat kuota trigger di luar jam kerja
  try { withLock_(function () { Db.ensureVersions(); Db.prefetch(); Object.keys(SCHEMA).forEach(function (n) { if (n !== 'AuditLogs' && n !== 'Sessions' && n !== 'ClientOps') Db.all(n); }); }); } catch (e) { }
}
/** Edit manual di spreadsheet → cache tabel terkait dibatalkan (simple trigger) */
function onEdit(e) { try { var n = e.range.getSheet().getName(); if (SCHEMA[n]) Db.invalidate([n]); } catch (er) { } }
/** Perubahan struktur (sisip/hapus baris/kolom) → batalkan semua cache (installable trigger) */
function onSheetChange(e) { try { if (!e || e.changeType !== 'EDIT') Db.invalidate(); } catch (er) { } }

/** Trigger harian: backup otomatis, verifikasi lisensi, bersihkan sesi kedaluwarsa, pengingat jatuh tempo */
function dailyJob() {
  Db.reset();
  var s = getSettings_();
  if (s.dailyBackup !== 'OFF') { try { backupNow_(null, { system: true }); } catch (e) { console.warn(e); } }
  try { License.refresh(); } catch (e) { }
  try {
    withLock_(function () {
      var old = Db.where('Sessions', function (x) { return x.revoked || x.expiresAt < nowIso_(); });
      if (old.length) Db.deleteRows('Sessions', old);
    });
  } catch (e) { }
  try {
    var lines = [];
    Db.live('Projects').forEach(function (p) {
      agingReport_(p.id).dueSoon.forEach(function (x) { if (x.daysOverdue >= -3) lines.push(p.code + ' ' + x.invoiceNumber + ' (' + x.counterpartyName + ') Rp ' + x.openAmount + (x.daysOverdue > 0 ? ' TELAT ' + x.daysOverdue + ' hr' : ' jatuh tempo ' + x.dueDate)); });
    });
    if (lines.length) { Notify.queue('Pengingat faktur:\n' + lines.slice(0, 15).join('\n')); Notify.flush(); }
  } catch (e) { }
}

/* ============================ Backup & Restore ============================ */
function backupTables_() { return Object.keys(SCHEMA).filter(function (n) { return ['Sessions', 'ClientOps', '_Blobs'].indexOf(n) < 0 && n.charAt(0) !== '_'; }); }

function exportState_() {
  var tables = {};
  backupTables_().forEach(function (n) { tables[n] = Db.all(n).map(function (r) { var o = {}; for (var k in r) o[k] = r[k]; return o; }); });
  return tables;
}

function backupNow_(actor, p) {
  p = p || {};
  if (actor) assertPerm_(actor, 'COMPANY_MANAGE');
  Db.reset();
  var tables = exportState_();
  var raw = JSON.stringify(tables);
  var counts = {}; for (var k in tables) counts[k] = tables[k].length;
  var payload = { format: 'HCERP-BACKUP', version: APP.VERSION, exportedAt: nowIso_(), exportedBy: actor ? actor.email : 'SYSTEM', counts: counts, stateHash: sha256Hex_(raw), tables: tables };
  var name = 'HCERP-backup-' + Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyyMMdd-HHmmss') + '.json';
  var folder = getOrCreateFolder_(APP.BACKUP_FOLDER);
  var content = JSON.stringify(payload);
  var file = folder.createFile(name, content, 'application/json');
  // simpan maksimal 30 file backup terbaru
  var files = [], it = folder.getFiles();
  while (it.hasNext()) { var f = it.next(); if (/^HCERP-backup-/.test(f.getName())) files.push(f); }
  files.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); });
  files.slice(30).forEach(function (f) { try { f.setTrashed(true); } catch (e) { } });
  if (actor) {
    mut_(function (tx) { audit_(tx, actor, { action: 'SYSTEM_BACKUP_EXPORTED', entityType: 'SystemBackup', entityId: file.getId(), sourceReference: name, summary: 'Backup database ' + name + ' (' + Math.round(content.length / 1024) + ' KB) disimpan ke Drive.', after: { counts: counts, stateHash: payload.stateHash } }); return null; });
  }
  var out = { fileId: file.getId(), fileName: name, url: file.getUrl(), sizeKb: Math.round(content.length / 1024), counts: counts, stateHash: payload.stateHash };
  if (p.download) out.content = content;
  return out;
}

function listBackups_(actor) {
  assertPerm_(actor, 'COMPANY_MANAGE');
  var folder = getOrCreateFolder_(APP.BACKUP_FOLDER);
  var out = [], it = folder.getFiles();
  while (it.hasNext()) { var f = it.next(); if (/^HCERP-backup-/.test(f.getName())) out.push({ fileId: f.getId(), fileName: f.getName(), sizeKb: Math.round(f.getSize() / 1024), createdAt: f.getDateCreated().toISOString(), url: f.getUrl() }); }
  out.sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  return out.slice(0, 30);
}

function restoreBackup_(actor, p) {
  assertPerm_(actor, 'COMPANY_MANAGE');
  if (p.confirm !== 'PULIHKAN') throw new AppError(400, 'CONFIRM_REQUIRED', 'Ketik PULIHKAN untuk konfirmasi pemulihan.');
  var content = p.content;
  if (!content && p.fileId) content = DriveApp.getFileById(p.fileId).getBlob().getDataAsString();
  var data = typeof content === 'string' ? safeParse_(content) : content;
  if (!data || data.format !== 'HCERP-BACKUP' || !data.tables) throw new AppError(400, 'BACKUP_INVALID', 'File bukan backup HC-ERP yang valid.');
  if (data.stateHash && sha256Hex_(JSON.stringify(data.tables)) !== data.stateHash) throw new AppError(400, 'BACKUP_TAMPERED', 'Integritas backup gagal (hash tidak cocok). File rusak atau telah diubah.');
  for (var n in data.tables) { if (!SCHEMA[n] || !Array.isArray(data.tables[n])) throw new AppError(400, 'BACKUP_INVALID', 'Tabel tidak dikenal di backup: ' + n); }
  if (!(data.tables.Users || []).some(function (u) { return u.role === ROLE.COMPANY_ADMIN && u.isActive && !u.deletedAt; })) throw new AppError(400, 'BACKUP_INVALID', 'Backup tidak memiliki admin aktif.');
  // backup otomatis kondisi saat ini sebelum menimpa
  var safety = backupNow_(null, { system: true });
  return withLock_(function () {
    var book = Db.ss();
    ['_Blobs'].concat(Object.keys(data.tables)).forEach(function (n) {
      var sh = book.getSheetByName(n);
      if (sh && sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(1, sh.getLastColumn())).clearContent();
    });
    Db.invalidate();
    Db.reset();
    var tx = new Db.Tx();
    for (var t in data.tables) data.tables[t].forEach(function (r) { tx.insert(t, r); });
    tx.commit();
    Db.reset();
    scanAuditTail_();
    var tx2 = new Db.Tx();
    var me = Db.byId('Users', actor.id) || actor;
    audit_(tx2, me, { action: 'SYSTEM_BACKUP_RESTORED', entityType: 'SystemBackup', entityId: data.stateHash || '', sourceReference: data.exportedAt, summary: 'Pemulihan database dari backup ' + data.exportedAt + ' oleh ' + actor.fullName + '. Backup pengaman sebelum restore: ' + safety.fileName + '.', after: { counts: data.counts } });
    tx2.commit();
    return { restored: true, safetyBackup: safety.fileName, counts: data.counts };
  });
}

/** Kosongkan data transaksi & master (mulai produksi). Pengaturan & akun admin pemanggil dipertahankan. */
function wipeData_(actor, p) {
  assertPerm_(actor, 'COMPANY_MANAGE');
  if (p.confirm !== 'HAPUS SEMUA DATA') throw new AppError(400, 'CONFIRM_REQUIRED', 'Ketik HAPUS SEMUA DATA untuk konfirmasi.');
  var safety = backupNow_(null, { system: true });
  return withLock_(function () {
    var me = Db.byId('Users', actor.id);
    var keep = ['Settings', 'Users', 'Sessions', 'AuditLogs'];
    var book = Db.ss();
    Object.keys(SCHEMA).forEach(function (n) {
      if (keep.indexOf(n) >= 0) return;
      var sh = book.getSheetByName(n);
      if (sh && sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(1, sh.getLastColumn())).clearContent();
    });
    Db.invalidate();
    var others = Db.where('Users', function (u) { return u.id !== me.id; });
    if (others.length) Db.deleteRows('Users', others);
    Db.reset();
    var tx = new Db.Tx();
    tx.insert('Branches', { id: uid_('br'), code: 'PUSAT', name: 'Kantor Pusat', city: '', address: '', createdAt: nowIso_(), deletedAt: '' });
    audit_(tx, me, { action: 'SYSTEM_DATA_WIPED', entityType: 'System', entityId: 'wipe', sourceReference: safety.fileName, summary: 'Seluruh data operasional dikosongkan oleh ' + me.fullName + '. Backup sebelum hapus: ' + safety.fileName + '.', after: {} });
    tx.commit();
    return { wiped: true, safetyBackup: safety.fileName };
  });
}

/* ============================ Self-test ============================ */
function runSelfTest_() {
  var results = [];
  function t(name, fn) {
    try { var r = fn(); results.push({ name: name, pass: r === true, info: r === true ? '' : String(r) }); }
    catch (e) { results.push({ name: name, pass: false, info: e.message || String(e) }); }
  }

      }).catch(function (e) {

/** Muat data: tampilkan salinan tersimpan seketika (bila ada), lalu perbarui dari server di latar */

    if (showedCache) S.refreshing = true, updateNet();

    return call('bootstrap', { projectId: pid }).then(function (d) { S.refreshing = false; applyBoot(d); }).catch(function (e) {
      S.refreshing = false; updateNet();
      if (!(e instanceof NetError)) throw e;

      if (showedCache) { toast('Offline: menampilkan data tersimpan ' + dtt(S.d.serverTime) + '.'); return; }
      return Store.get('kv', 'boot:last').then(function (d) {
        if (!d) { $('#app').innerHTML = '<div class="loading-full"><div class="empty"><b>Tidak ada koneksi dan belum ada data tersimpan</b>Buka aplikasi sekali saat online agar data proyek tersimpan untuk mode offline.<br><br><button class="btn" onclick="location.reload()">Coba lagi</button></div></div>'; return; }
        S.d = d; S.fromCache = true; S.projectId = d.activeProjectId; renderShell(); toast('Mode offline: menampilkan data tersimpan ' + dtt(d.serverTime) + '.');
      });
    });
  };
  if (silent || !uid) return fetchFresh(false);
  return Store.get('kv', 'boot:' + uid + ':' + pid).then(function (c) {
    if (!c && !pid) return Store.get('kv', 'boot:last');
    return c;
  }).then(function (c) {
    if (c && c.actor && c.actor.id === uid && (!pid || c.activeProjectId === pid)) {
      S.d = c; S.fromCache = false; S.projectId = c.activeProjectId; renderShell();

  });
}

function start() {
  return loadOutbox().then(function () { return loadData(S.projectId); }).then(function () { if (S.online) syncOutbox(); });
}
function boot() {
  applyTheme(); applyBrandChrome();
  if (!IS_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
  if (isPortalMode()) { portalBoot(); return; }
  if (IS_GAS && google.script.url && !lsGet('hc_mode_checked')) {
    try { google.script.url.getLocation(function (l) { if (l && l.parameter && l.parameter.portal) { lsSet('hc_mode', 'portal'); portalBoot(); } }); } catch (e) { }
  }
  if (!S.token) { loadOutbox(); renderLogin(); return; }
  saveSyncAuth();
  start().catch(function (e) { if (!(e instanceof AppErr && /AUTH/.test(e.code))) renderLogin(errMsg(e)); });
  setInterval(function () { if ((S.online || navigator.onLine) && S.outbox.some(function (x) { return x.status === 'PENDING'; })) { S.online = true; syncOutbox(); } }, 30000);
}

/* ---------------- Impor / ekspor ---------------- */
function normKey(s) { return String(s || '').toUpperCase().replace(/^(KAV(LING)?|UNIT|NO)[\s._-]*/, '').replace(/[^A-Z0-9]/g, ''); }
function parseKml(txt) {
  var doc = new DOMParser().parseFromString(txt, 'text/xml'), out = [];
  Array.prototype.slice.call(doc.getElementsByTagName('Placemark')).forEach(function (pm) {
    var name = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
    var props = { name: name };
    Array.prototype.slice.call(pm.getElementsByTagName('SimpleData')).concat(Array.prototype.slice.call(pm.getElementsByTagName('Data'))).forEach(function (x) { var k = x.getAttribute('name'); var v = x.getElementsByTagName('value')[0]; props[k] = v ? v.textContent : x.textContent; });
    var coords = function (el) { return el.textContent.trim().split(/\s+/).map(function (t) { var a = t.split(',').map(Number); return [a[0], a[1]]; }); };
    var polys = Array.prototype.slice.call(pm.getElementsByTagName('Polygon')).map(function (pg) {
      var outer = pg.getElementsByTagName('outerBoundaryIs')[0], inner = Array.prototype.slice.call(pg.getElementsByTagName('innerBoundaryIs'));
      return [coords(outer.getElementsByTagName('coordinates')[0])].concat(inner.map(function (b) { return coords(b.getElementsByTagName('coordinates')[0]); }));
    });
    var geom = polys.length > 1 ? { type: 'MultiPolygon', coordinates: polys } : polys.length ? { type: 'Polygon', coordinates: polys[0] } : null;
    if (!geom) { var pt = pm.getElementsByTagName('Point')[0]; if (pt) geom = { type: 'Point', coordinates: coords(pt.getElementsByTagName('coordinates')[0])[0] }; }
    if (geom) out.push({ type: 'Feature', properties: props, geometry: geom });
  });
  return out;
}
function featuresFrom(txt, name) {
  if (/\.kml$/i.test(name) || /^\s*</.test(txt)) return parseKml(txt);
  var j = JSON.parse(txt);
  if (j.crs && j.crs.properties && !/4326|CRS84/.test(j.crs.properties.name || '')) throw new Error('Sistem koordinat berkas ' + j.crs.properties.name + '. Ekspor ulang dari QGIS dengan CRS EPSG:4326 (WGS 84).');
  return j.type === 'FeatureCollection' ? j.features : j.type === 'Feature' ? [j] : [{ type: 'Feature', properties: {}, geometry: j }];
}
var MP_KEYS = ['unitNumber', 'unit_number', 'kavling', 'no_kavling', 'nokav', 'no_kav', 'kav', 'unit', 'nomor', 'name', 'Name', 'NAMA', 'nama', 'label', 'id_kav', 'blok_no'];
document.addEventListener('change', function (e) {
  if (e.target.id !== 'mpImport') return;
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var feats;
    try { feats = featuresFrom(String(rd.result), f.name); } catch (er) { return toast('Berkas tidak dapat dibaca: ' + errMsg(er), 'err'); }
    var idx = {}; (S.d.houseUnits || []).forEach(function (u) { idx[normKey(u.unitNumber)] = u; });
    var match = [], miss = [];
    feats.forEach(function (ft) {
      var p = ft.properties || {}, u = null, key = '';
      for (var i = 0; i < MP_KEYS.length && !u; i++) if (p[MP_KEYS[i]] !== undefined && p[MP_KEYS[i]] !== null) { key = p[MP_KEYS[i]]; u = idx[normKey(key)]; }
      if (!u) { var blk = p.blok || p.block || p.BLOK, no = p.no || p.nomor || p.NO; if (blk && no) { key = blk + '-' + no; u = idx[normKey(key)] || idx[normKey(String(blk).replace(/^blok\s*/i, '') + '-' + String(no).padStart(2, '0'))]; } }
      var g = ft.geometry, c = g && (g.type === 'Point' ? g.coordinates : g.type === 'Polygon' ? g.coordinates[0][0] : g.type === 'MultiPolygon' ? g.coordinates[0][0][0] : null);
      if (c && (Math.abs(c[0]) > 180 || Math.abs(c[1]) > 90)) { miss.push({ key: key || '(tanpa nama)', why: 'koordinat bukan derajat — ekspor dengan EPSG:4326' }); return; }
      if (u && g) match.push({ unitId: u.id, unitNumber: u.unitNumber, geom: g, had: !!u.geom }); else miss.push({ key: key || JSON.stringify(p).slice(0, 40), why: g ? 'tidak ada kavling dengan nomor ini' : 'tanpa geometri' });
    });
    showInfo('Impor batas kavling — ' + esc(f.name), '<p>' + feats.length + ' fitur dibaca: <b>' + match.length + ' cocok</b> dengan kavling, ' + miss.length + ' tidak cocok.</p>' +
      (match.length ? '<div class="small">' + match.map(function (m) { return '<span class="chip">' + esc(m.unitNumber) + (m.had ? ' (ganti)' : '') + '</span>'; }).join(' ') + '</div>' : '') +
      (miss.length ? '<details class="small" style="margin-top:8px"><summary>Tidak cocok (' + miss.length + ')</summary>' + miss.slice(0, 50).map(function (m) { return '<div>' + esc(m.key) + ' — ' + esc(m.why) + '</div>'; }).join('') + '</details>' : '') +
      '<p class="small muted">Nomor kavling dibaca dari atribut <code>unitNumber</code>, <code>kavling</code>, <code>no_kav</code>, <code>name</code>/<code>nama</code>, atau gabungan <code>blok</code> + <code>no</code>. Koordinat harus WGS 84 (EPSG:4326).</p>' +
      (match.length ? '<button class="btn primary" id="mpImpGo">Simpan ' + match.length + ' batas kavling</button>' : ''), true);
    var go = $('#mpImpGo');
    if (go) go.onclick = function () { go.disabled = true; doMutate('unit.geoImport', { projectId: S.d.activeProjectId, projectCenter: true, items: match.map(function (m) { return { unitId: m.unitId, geom: m.geom }; }) }, match.length + ' batas kavling diimpor.').then(function () { closeModal(); if (S.route === 'map') { rerenderBody(); } }).catch(function (er) { go.disabled = false; toast(errMsg(er), 'err'); }); };
  };
  rd.readAsText(f); e.target.value = '';
});
ACT['mp-export'] = function () {
  var p = (S.d.projects || []).filter(function (x) { return x.id === S.d.activeProjectId; })[0] || {};
  var fc = { type: 'FeatureCollection', name: 'kavling_' + (p.code || 'proyek'), crs: { type: 'name', properties: { name: 'urn:ogc:def:crs:OGC:1.3:CRS84' } }, features: (S.d.houseUnits || []).filter(unitGeo).map(function (u) {
    var g = unitGeo(u);
    return { type: 'Feature', properties: { unitNumber: u.unitNumber, blok: u.blockCode, tipe: u.unitType, status_jual: SALE_LABEL[saleKey(u)], status_bangun: STATUS_LABEL[u.status] || u.status, progres: n(u.progressPercent), harga: n(u.salePrice), lt_m2: n(u.landAreaM2), lb_m2: n(u.buildingAreaM2), luas_peta_m2: Math.round(geoArea(g) * 100) / 100, hadap: u.facing || '', catatan: u.mapNote || '' }, geometry: g };
  }) };
  if (!fc.features.length) return toast('Belum ada kavling yang dipetakan.', 'err');
  download('kavling-' + (p.code || 'proyek') + '.geojson', JSON.stringify(fc, null, 1), 'application/geo+json');

/* ---------------- Peta mini di Portal Pemilik Rumah ---------------- */
function portalMapInit(u) {
  var el = $('#ptMap'); if (!el || !unitGeo(u)) return;
  loadLeaflet().then(function (LF) {
    if (!$('#ptMap')) return;
    if (P.map) { try { P.map.remove(); } catch (e) { } }
    var b = baseLayers(LF), g = unitGeo(u);
    var m = P.map = LF.map(el, { zoomControl: true, attributionControl: true, layers: [b.sat, b.lbl], scrollWheelZoom: false, maxZoom: 21 });
    var lyr = g.type === 'Point' ? LF.circleMarker([g.coordinates[1], g.coordinates[0]], { radius: 10, color: '#fff', weight: 3, fillColor: '#F2A900', fillOpacity: 0.9 }) : LF.geoJSON(g, { style: { color: '#FFFFFF', weight: 3, fillColor: '#F2A900', fillOpacity: 0.45 } });
    lyr.bindTooltip('Rumah ' + esc(u.unitNumber), { permanent: true, direction: 'center', className: 'mp-label-tip' }).addTo(m);
    if (lyr.getBounds) m.fitBounds(lyr.getBounds(), { maxZoom: 19, padding: [40, 40] }); else m.setView(lyr.getLatLng(), 19);
  }).catch(function (e) { el.innerHTML = '<div class="small muted" style="padding:12px">' + esc(errMsg(e)) + '</div>'; });
}
